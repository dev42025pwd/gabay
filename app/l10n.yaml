# Flutter's built-in localisation (ARB). Wording lives ONLY in lib/l10n/*.arb;
# this file configures `flutter gen-l10n`, which `flutter pub get`, `flutter
# test` and `flutter build` also run because pubspec.yaml has `generate: true`.
#
# English only until P0-14: the Tagalog app_tl.arb is added after the product
# owner's review (L109); it is never machine-translated.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
# Generated Dart is committed beside the ARB files and excluded from analysis.
#
# A key that a non-template locale lacks does NOT fail generation: the app
# shows the English text and gen-l10n only prints a status line. Two guards
# stand in for that failure:
#   1. the report below lists every untranslated key per locale (written to the
#      app folder as untranslated.json, which app/.gitignore keeps out of git);
#   2. test/arb_integrity_test.dart fails when any app_<locale>.arb lacks a key
#      of the template (or has an unknown one).
untranslated-messages-file: untranslated.json
# `AppLocalizations.of(context)` returns a non-null value.
nullable-getter: false
