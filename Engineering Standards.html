<script type="text/plain" id="src-audit"># Project Standards Audit Prompt

> **Version**: 1.0 | **Date**: 2026-09-20 | **Status**: Living document
> **Pairs with**: `NEW_PROJECT_STANDARDS_CHECKLIST.md` (§1–§14)
> **How to use:** copy `NEW_PROJECT_STANDARDS_CHECKLIST.md` into the target repo's root, open an AI coding agent (Claude Code or equivalent) in that repo, and paste everything below the line as the prompt. The output is a gap report, not code changes.

---

# ROLE

You are a Principal Full-Stack Engineer performing a **standards-compliance audit** of this repository against the company engineering standard. You are auditing, not fixing: **make no code changes during this audit.**

# REQUIRED READING

Before anything else, read `NEW_PROJECT_STANDARDS_CHECKLIST.md` in the repo root in full. It is the ruling document. Do not re-litigate its rules or substitute your own preferences; where this project genuinely cannot follow a rule, that is a finding to report, not a rule to waive.

**Appendix A (§10) and Appendix B (§11) are normative, not illustrative.** Appendix A is the canonical shape of the patterns §3–§4 mandate; Appendix B is the required structure of the three core documents. A document missing an Appendix B section, or a pattern that diverges from Appendix A in a load-bearing way, is a finding against the §2/§3/§4 item that requires it.

# METHOD

## Step 1 — Inventory (before any verdicts)

Establish what this project actually is:

- Stack: languages, frameworks, DB, key libraries with versions (read the package manifests — do not guess from folder names).
- Entrypoints, folder layout, how it is run and deployed.
- What exists of: docs, tests, CI, git hooks, `.env.example`, seeds/migrations.
- **Project profile**, because it decides which sections are genuinely N/A: single- vs multi-tenant; write-contention level; whether the system handles money and whether it *moves* money; internal-only vs external customers; always-connected vs intermittent; single instance vs horizontally scaled. State the profile explicitly — every later N/A must trace back to it.

Report any deviation from the mandated stack (checklist §1) immediately and prominently — everything downstream is colored by it.

## Step 2 — Walk the checklist

Go through checklist sections §2–§9 item by item, **auditing the three required documents against the templates in Appendix B** and the mandated patterns against Appendix A. For **every** checkbox, assign exactly one verdict:

| Verdict | Meaning |
|---|---|
| **PASS** | Implemented as specified. Cite evidence. |
| **PARTIAL** | Exists but violates part of the rule. Say precisely which part. |
| **FAIL** | Absent, or contradicts the rule. |
| **N/A** | Genuinely inapplicable (e.g. tenancy items in a single-tenant system, SSE items in a system with no realtime). One-line justification required, traceable to the Step 1 profile. **"We haven't gotten to it" is FAIL, not N/A.** |
| **UNVERIFIED** | You could not confirm either way. Never upgrade this to PASS. |

**Evidence rules — non-negotiable:**

- Every PASS and PARTIAL cites at least one `file:line`.
- Verdicts come from reading the code, never from file names, README claims, or comments. A file named `auditLogger.js` proves nothing until you've read what it writes and when.
- Sample honestly: for repo-wide rules (parameterized SQL, tenant predicates, error shapes, `FieldSpec` usage), grep the whole repo and read a representative sample of hits — state your sample size. One clean file is not a PASS for a rule about all files.

## Step 3 — Hunt the known failure classes

Independently of the walk, run targeted searches for the defect patterns the standard exists to prevent, and report every hit:

1. **SQL injection surface:** string interpolation/concatenation into query text (template literals containing `SELECT|INSERT|UPDATE|DELETE` with `${`); client-supplied sort/order-by columns not passed through an allow-list map; client-supplied lookup names indexing into table names (§3.19).
2. **Money in floats:** arithmetic on monetary values without `decimal.js` (or equivalent exact-decimal library); `parseFloat`/`Number` on amounts followed by `+ - * /`; client-side rounding of money that does not match the server's `ROUND_HALF_UP`.
3. **Tenant leaks** (if multi-tenant): queries on tenant-scoped tables missing the tenant predicate; controllers reading the tenant id from the JWT user object instead of the request's tenant context; DELETEs without the tenant clause; lookup/picker queries missing the predicate.
4. **Secrets:** real `.env`/keys/certs committed (check the working tree AND `git log --diff-filter=A -- '*.env*'` for history); passwords or tokens logged or stored unredacted in audit rows; secrets echoed in error responses.
5. **Unguarded routes:** mutating endpoints missing authN or authZ middleware; unauthenticated mounts registered AFTER a guarded `app.use` on the same prefix (order matters); admin-only actions gated in the UI but not on the server.
6. **Privilege escalation:** user-management endpoints where a non-superuser can set/clear superuser or change their own role/grants.
7. **Error leaks:** driver/stack/SQL text reaching the client; inconsistent error body shapes.
8. **Date shifting:** DATE columns serialized straight through `res.json` (no boundary projection); date strings bound directly to date-typed SQL params; timestamp column DEFAULTs mismatched with the driver's UTC setting; a client date picker that emits a full ISO timestamp into a `DATE` column.
9. **Frontend:** `$e`/raw exceptions interpolated into user-facing text; `ScaffoldMessenger.showSnackBar` outside the sanctioned messaging surface; `ThemeData.primaryColor` or hardcoded `Colors.black/grey/white/0xFF` literals outside the token file; menu items whose backend blocks that role (visible-but-403 dead ends); per-feature SSE/EventSource connections instead of one multiplexed stream; unguarded `flutter_secure_storage` calls on web.
10. **Process:** hand-edited migration files (check `git log --follow` on a sample); `CREATE TABLE`s missing teardown in the canonical schema; hand-authored changelog versions/dates; test phases/functions defined but never invoked.
11. **Doc-set integrity:** required docs that exist as titles with empty sections (a stub is acceptable at [P0], an empty stub at release is FAIL); PRD acceptance criteria that are not testable as written ("supports X", "handles Y"); pipeline entries with a `DONE` status but unticked definition-of-done items; pipeline IDs that were renumbered (check `git log -p` on the pipeline for changed ID lines); PRD §9 and Blueprint Part 5 milestone tables that no longer match; any fact duplicated across PRD, Blueprint, and pipeline in conflicting forms.
12. **Mandatory-improvement gaps (§12):** the eleven items in checklist §12 are mandatory for new projects, not aspirational. Audit each one explicitly — schema-validation middleware, ESLint/Prettier + `analysis_options.yaml`, structured logger, single error shape, HMAC over raw bytes, zero-padded migration numbers, injectable ApiClient seam, README carrying the hooks step, tenant-scope lint, configurable lockout threshold, generated test-case totals.
13. **Schema↔form disagreement and hardcoded reference data (§3.19, §4.10):** option lists as literal arrays or enums in view/viewmodel files where the values are business-extensible (grep the frontend for string-list literals feeding a dropdown, and for `const` maps of ids to labels); text inputs with no `maxLength` writing to `NVARCHAR(n)`, or a `maxLength` that disagrees with the column; `BIT` columns fed by a three-option dropdown; FK fields rendered as free-text ids or as load-all dropdowns rather than the async paginated picker; pickers that omit the currently-held value when it is inactive (read the picker's query for an `IsActive` filter with no retain-current clause); lookup endpoints per feature instead of one allow-listed lookup controller; reference tables present in the schema with no maintenance screen or no permission/menu rows seeded; upload MIME/size limits declared separately on client and server. For each hit, state whether the disagreement fails **closed** (the client refuses a value the column accepts — annoying) or **open** (the client accepts a value the column refuses — a 500 or a silent truncation on save).
14. **Agent-configuration drift (§14):** `CLAUDE.md` absent, over a page, or naming commands that no longer exist; a `CLAUDE.md` verification block whose command fails or does not exist; skills whose text has drifted from the checklist section they carry (diff each skill against its source section and report the divergence); hooks present in a repo file that ought to be in managed settings (production gates, protected paths — anything an engineer must not be able to switch off); a shared skills plugin installed with no `evals/` directory, which is the single highest-severity finding in this class because one bad skill edit then reaches every repo unchecked; `REVIEW.md` absent, or reporting findings that CI already enforces; pipeline entries with no `Intent`/`Spec`/`Plan`/`PR` rows while `intent/` exists, which means the two layers have already split; `plan.md` files whose named files diverge from the merged diff.

## Step 4 — Report

Produce the report in exactly this structure:

**A. Executive summary** — one paragraph, then a table: `Checklist section | PASS | PARTIAL | FAIL | N/A | Worst finding (one line)`.

**B. Stack deviations (§1)** — anything off the mandated stack, each marked either *migrate* or *needs lead sign-off as a standing exception*.

**C. Compliance matrix** — every checklist item: `Item | Verdict | Evidence (file:line) | Note`. Group by checklist section, keep notes to one line.

**D. Failure-class findings (Step 3)** — each hit: what, where (`file:line`), **severity (Critical / High / Medium / Low)**, why it's dangerous in one sentence, which checklist item it violates.

**E. Remediation plan — top 10.** Ordered by the severity assigned in D, with the security > data integrity > correctness > process/docs tier as the tiebreak. For each: the fix in one or two sentences, effort (S = hours, M = days, L = weeks), the checklist item(s) it satisfies, and any ordering dependency on other fixes.

**F. Quick wins** — everything fixable in under a day that is not already in the top 10.

**G. Honest limits** — what you could not verify (no DB access, no running environment, generated code you skipped) so nobody mistakes silence for compliance. List by path everything you excluded: vendored code, generated code, build output, third-party bundles.

**H. Rules this repo needs that the checklist does not have** — patterns, risks, or defect classes specific to this system's domain that §1–§14 does not cover. State each as a proposed rule plus the enforcer it would get. The checklist was distilled from a single reference system; this section is how the next one improves it, and it is triaged into checklist §13. If you have nothing, write "nothing" rather than omitting the section.

**I. Machine-readable matrix** — emit section C a second time as a fenced JSON array, one object per item: `{"section":"3.4","item":"<first eight words>","verdict":"PASS","evidence":"file.js:120","severity":null}`. Findings from D carry `"severity":"critical|high|medium|low"`. This exists so the next audit of this repo can be diffed against this one instead of read alongside it.

# RULES

1. Read-only. Do not edit, create, or delete project files; do not run migrations, seeds, or anything that writes to a database.
2. Running read-only commands (greps, `git log`, dependency listing, linters in check mode) is encouraged. Running the app or its tests is allowed only if it cannot write to a shared/production resource — when in doubt, don't, and record it under G.
3. No verdict without evidence; no evidence without having read it.
4. If the repo is too large to audit exhaustively in one pass, say so up front, audit security (§3, §6), process guardrails (§8), the §12 mandatory improvements and the §14 agent configuration exhaustively, sample the rest, and state the sampling.
5. Ask at most one clarifying question, and only if the audit is impossible without the answer; otherwise proceed and record assumptions under G.
6. Finish with the single sentence: **"Audit complete — verdicts: X PASS / Y PARTIAL / Z FAIL / N N/A / U UNVERIFIED; findings: C critical / H high / M medium / L low."**
</script>

<script type="text/plain" id="src-prd"># RetailPOS — Product Requirements Document

> **Version**: 1.0 | **Date**: 2026-09-20 | **Status**: Draft for sign-off | **Owner**: Product Owner
> **Engineering counterpart**: `RETAILPOS_MASTER_BLUEPRINT.md` | **Delivery status**: `FEATURE_PIPELINE.md`
> *Worked example, written to `NEW_PROJECT_STANDARDS_CHECKLIST.md` Appendix B.1. Sections are stable anchors — append, never renumber.*

## 1. Executive Summary

RetailPOS is a multi-branch point-of-sale and daily-sales system for Philippine retail SMEs running 2–15 branches. It replaces per-branch standalone registers and the manual consolidation that follows them, giving owners same-day visibility of sales, stock movement, and cash position across every branch from one screen — while keeping each lane able to finish a sale when the internet drops.

## 2. Product Vision

Beyond MVP, RetailPOS grows toward loyalty programs, supplier purchase orders with receiving, and multi-branch stock transfers with in-transit tracking.

**What RetailPOS will NOT be:**
- **Not an accounting system.** It produces sales, tax, and cash-position data and exports it. It does not hold a general ledger, does not do journal entries, and does not close books.
- **Not a payroll or HR system**, even though it tracks which cashier rang which sale.
- **Not an e-commerce platform.** No customer-facing storefront, no online ordering.
- **Not a warehouse management system.** Stock is tracked at branch level in whole selling units; there is no bin, pallet, or pick-path modelling.
- **Not a hardware vendor.** We integrate with printers, scanners, and terminals from a supported list; we do not source or support them.

## 3. Target Users & Personas

**Cashier (Marisol)** — rings up sales at a fixed lane. Core need: finish a transaction in under 40 seconds without thinking about the software. *Environment:* touchscreen terminal at a counter, thermal receipt printer and barcode scanner attached, store Wi-Fi that drops for a few minutes several times a week. Frequently interrupted mid-sale.

**Branch Supervisor (Ronel)** — opens and closes the branch, approves voids and discounts, counts the drawer. Core need: an end-of-day that reconciles to the peso and shows him *why* when it does not. *Environment:* shares the lane terminal or a small back-office desktop; on the floor most of the day.

**Owner / Operations Manager (Lita)** — runs 2–15 branches. Core need: today's sales and stock position across all branches without phoning anyone. *Environment:* laptop at home or in a car, mobile phone, often on cellular data. Checks in twice a day.

**Inventory Clerk (Jun)** — maintains items, prices, and stock counts. Core need: change a price once and have every branch honour it tomorrow morning. *Environment:* back-office desktop, spreadsheets from suppliers.

**Accountant / BIR-facing staff (Grace)** — external or part-time. Core need: reports that match what the BIR expects, without re-keying. *Environment:* desktop, monthly cadence, high consequence for errors.

## 4. Problem Statement

Branch registers do not talk to each other. Consolidating a day's sales takes the owner's staff 2–3 hours each morning, from photos of Z-readings sent over chat, and the resulting figures are wrong often enough that stock counts are reconciled only monthly. Across a 6-branch client we scoped, that is roughly 60 staff-hours a month spent re-keying, an average 4-day lag before an owner sees a bad day, and shrinkage that surfaces weeks after it happens. Price changes take a week to reach every branch and are frequently missed at one or two, producing customer disputes and price-tag-law exposure. Meanwhile BIR accreditation requirements for POS are tightening, and the existing standalone registers cannot produce what is now being asked for.

## 5. Solution Overview

**Selling** — the lane: item lookup by scan or search, cart, discounts, tender, receipt. Runs degraded but functional when offline, and syncs when the link returns. For cashiers.

**Cash & End-of-Day** — shift open/close, drawer count, X and Z readings, variance explanation. Produces the numbers the branch is held to. For supervisors.

**Catalogue & Pricing** — items, categories, units, tax treatment, price lists, and branch-level price overrides. One place to change a price. For the inventory clerk.

**Stock** — receiving, adjustments with reason codes, and branch stock on hand, moved by selling and by explicit adjustments only. For the inventory clerk and supervisor.

**Consolidated Reporting** — sales, tax, cash position, and stock across branches, with export. For the owner and the accountant.

**Administration** — branches, users, roles and permissions, terminals, and every reference list in the system. For the owner and system administrator.

## 6. Feature Requirements & Prioritization

### 6.1 Ring up a sale (Priority: High)

Cashier builds a cart by scanning a barcode or searching by name or SKU, adjusts quantities, and completes the sale with a tender. The lane must remain usable during a network outage: sales queue locally and sync when connectivity returns.

**Acceptance criteria**
- A cashier can add an item by scanning its barcode and see it appear in the cart within one second.
- A cashier can add an item by typing at least three characters of its name or SKU and choosing from the results.
- A cashier can change a line quantity, and the cart total recalculates immediately.
- A cashier can void a line item before payment, and the void appears in the audit trail with the cashier's name and the time.
- A cashier can complete a cash sale and a printed receipt is produced.
- With the network disconnected, a cashier can complete a cash sale; the receipt prints; the sale appears in the branch's sales list within two minutes of connectivity returning, exactly once.
- A sale that has been paid cannot be edited by anyone; it can only be reversed by a return (§6.4).

**Out of scope:** split tender across multiple payment types, and card or e-wallet payment (§6.9).

### 6.2 Shift and end-of-day (Priority: High)

A supervisor opens a shift with a starting cash float and closes it with a counted drawer. The system produces the X reading during the shift and the Z reading at close, and requires an explanation when counted cash differs from expected.

**Acceptance criteria**
- A supervisor can open a shift, entering a starting float; no sale can be rung on a terminal with no open shift.
- A supervisor can produce an X reading at any time during an open shift without closing it.
- On close, the system shows expected cash, prompts for counted cash, and displays the variance.
- A variance outside a configurable tolerance requires a written reason before the shift can close.
- A closed shift's Z reading is immutable and reprintable, and carries a sequential Z number that never repeats or skips.
- A cashier cannot close a shift they did not open, and cannot close another cashier's shift.

**Out of scope:** cash pickups and mid-shift drops (P1), and multi-drawer terminals.

### 6.3 Item catalogue and pricing (Priority: High)

The inventory clerk maintains items with their category, unit, tax treatment, and price. Prices are effective-dated so a change can be scheduled, and a branch can override a price where local pricing genuinely differs.

**Acceptance criteria**
- A clerk can create an item with a name, SKU, barcode, category, selling unit, tax treatment, and price.
- Two items cannot share a barcode; attempting it produces a message naming the conflicting item.
- A clerk can schedule a price change with an effective date, and lanes use the new price from that date's first sale onward without anyone touching the terminal.
- A clerk can set a branch-level price override, and only that branch's lanes use it.
- An item can be deactivated; it stops appearing in lane search, and past sales that reference it still display it correctly.
- Categories, units, and tax treatments are maintained in the system by an administrator, not fixed in code.

**Out of scope:** item variants and matrix items (size/colour), and supplier cost tracking.

### 6.4 Returns and refunds (Priority: High)

A supervisor processes a return against an original sale, with a reason, returning stock and cash.

**Acceptance criteria**
- A supervisor can find an original sale by receipt number and return one or more of its lines.
- A return requires a reason chosen from an administrator-maintained list.
- The quantity returned across all returns cannot exceed the quantity sold on that line.
- A return produces its own document with its own number; the original sale document is never modified.
- Returned stock is added back to the branch's on-hand count, unless the reason is marked as non-restocking.
- A cashier cannot process a return without supervisor approval on the terminal.

**Out of scope:** returns without a receipt, and exchanges as a single transaction.

### 6.5 Stock receiving and adjustment (Priority: High)

The clerk records stock arriving at a branch and corrects counts with a reason.

**Acceptance criteria**
- A clerk can record a receipt of stock at a branch, entering item and quantity, and the branch's on-hand increases by that quantity.
- A clerk can record an adjustment, positive or negative, with a reason from an administrator-maintained list.
- Every change to on-hand quantity is attributable to a sale, return, receipt, or adjustment; there is no other way for the number to move.
- A user can view the movement history for an item at a branch and see each movement's type, quantity, resulting balance, actor, and time.
- On-hand quantity cannot be edited directly on any screen.

**Out of scope:** inter-branch transfers (P1), purchase orders, and cycle counting.

### 6.6 Consolidated reporting (Priority: High)

The owner sees today and any past period across all branches, and exports for the accountant.

**Acceptance criteria**
- An owner can view total sales, transaction count, and average basket by branch for a chosen date range.
- An owner can view sales by category and by item across branches for a chosen date range.
- An owner can view current stock on hand by item across branches.
- Every report can be exported to a spreadsheet file with the same figures as the screen.
- An owner sees only branches they are granted; a supervisor sees only their own branch.
- A report covering a date range returns within ten seconds for a 15-branch, one-year dataset.

**Out of scope:** custom report building, and scheduled emailed reports (P2).

### 6.7 Users, roles, and branch access (Priority: High)

An administrator manages who can do what, and where.

**Acceptance criteria**
- An administrator can create a user, assign a role, and grant access to one or more branches.
- A user with no grant to a branch cannot see or act on that branch's data by any route.
- A non-administrator cannot change their own role or branch grants, and cannot grant administrator rights.
- Every permission change is recorded with who made it and when.
- A locked-out user can be unlocked by an administrator, and the lockout threshold is configurable.

**Out of scope:** single sign-on, and time-limited access grants.

### 6.8 BIR-compliant receipts and reports (Priority: High)

Receipts and daily readings carry what the BIR requires.

**Acceptance criteria**
- Every receipt carries the business name, TIN, branch address, machine identifiers, a sequential receipt number, the VAT breakdown, and the required footer text.
- Receipt numbers are sequential per terminal and never repeat or skip; a gap is detectable in a report.
- The system produces the required daily and monthly sales summaries in the prescribed layout.
- Senior-citizen and PWD discounts capture the ID details required and apply the statutory VAT treatment.
- No sale can be deleted from the system by any user, including an administrator.

**Out of scope:** direct electronic transmission to BIR, and CAS accreditation paperwork itself, which is a client-side dependency (§8).

### 6.9 Card and e-wallet tender (Priority: Medium)

Accept non-cash payment through a supported terminal.

**Acceptance criteria**
- A cashier can select a non-cash tender type and record the approval reference.
- A sale can be split across at most two tender types.
- Non-cash tenders appear separately in the Z reading and reconcile independently of drawer cash.
- A failed or cancelled authorization leaves the sale unpaid and re-tenderable, never partially completed.

**Out of scope:** integrated terminal control in MVP — reference is entered by the cashier from the terminal's own output.

### 6.10 Inter-branch stock transfer (Priority: Medium)

**Acceptance criteria**
- A clerk can raise a transfer from one branch to another, and stock leaves the sending branch on dispatch.
- Stock is visible as in-transit and is on neither branch's sellable on-hand until received.
- The receiving branch confirms receipt, optionally with a discrepancy and a reason.
- A transfer cannot be dispatched for more than the sending branch's on-hand.

**Out of scope:** courier tracking integration.

### 6.11 Loyalty and customer accounts (Priority: Low)

**Acceptance criteria**
- A cashier can attach a customer to a sale by phone number.
- Points accrue by a configurable rule and are visible on the receipt.
- Points can be redeemed as a discount, with the redemption recorded against the sale.

**Out of scope:** tiers, campaigns, and messaging.

## 7. Technical Requirements & Constraints

**Deployment posture.** Cloud-hosted, one deployment serving many client businesses. Each branch's lanes reach it over the internet; the lane must degrade to offline selling and resync. No per-client on-premises installation in MVP.

**Stack.** As mandated by the company engineering standard — see `RETAILPOS_MASTER_BLUEPRINT.md` Part 1 for the allow list and deny list. No stack decisions are made in this document.

**Compliance jurisdiction.** Philippines.
- **BIR** — POS/CAS accreditation for the machine and software; sequential unalterable receipt numbering; required receipt content; daily and monthly sales summaries; no deletion of sales records; retention of sales data for the statutory period.
- **Senior Citizen Act (RA 9994) and Magna Carta for PWD (RA 10754)** — mandated discount and VAT-exemption treatment, with ID capture.
- **Price Tag Law (RA 7394)** — displayed price must match charged price; this is what makes effective-dated pricing in §6.3 a compliance feature, not a convenience.
- **Data Privacy Act (RA 10173)** — customer data in §6.11, cashier records, and audit data; consent, access requests, and breach notification obligations.

**Scale expectations.** Per client business: up to 15 branches, up to 4 lanes per branch, up to 60 named users. Peak 400 transactions per hour per branch during a sale event, averaging 6 lines per transaction. 1.5 million sale lines per year for a 6-branch client. Up to 40 client businesses on one deployment in year one. A lane must survive 4 hours offline without losing a sale.

**Non-functional.** Item scan to cart under 1 second at the lane. Report queries under 10 seconds at stated scale. A lane terminal must recover from a power loss mid-sale without producing a duplicate or a partial sale.

## 8. Dependencies & Integration Points

**External systems and hardware**
- Thermal receipt printers, supported models only; ESC/POS.
- USB and Bluetooth barcode scanners in keyboard-wedge mode.
- Cash drawers opened via the receipt printer.
- Payment terminals (§6.9), reference-entry only in MVP; no integrated control.
- Accounting export to the client's existing package, file-based.

**Human and vendor dependencies — the ones that slip schedules**
- **Client must supply clean opening item master and opening stock counts per branch.** This is the single largest go-live risk. Historically these arrive as inconsistent spreadsheets; budget for a cleanup cycle per client and treat the import tool as a first-class feature, not a script.
- **Client must complete BIR CAS/POS accreditation.** The paperwork and the BIR's turnaround are outside our control and have run 6–12 weeks. It must start at project kickoff, not at go-live.
- **Printer and scanner procurement lead time is approximately 6 weeks** for the supported models.
- **Branch internet provisioning** at any new branch; offline mode covers outages, not the absence of a connection.
- **A named super-user per client** for reference data, price approval, and go-live sign-off.
- **Cashier training window** at each branch, scheduled around trading hours, typically outside them.

## Part 2 — Architectural Blueprint

### 2.1 Tenancy model

Two dimensions, both mandatory on scoped tables.

- **Tenant = client business.** Hierarchical over everything. A user, branch, item, and sale all belong to exactly one tenant. No object is ever shared across tenants, including reference data — each tenant maintains its own categories, reasons, and tender types.
- **Branch = trading location.** Non-hierarchical, a flat set within a tenant. Users hold explicit grants to one or more branches (PRD §6.7). Stock, shifts, terminals, and sales are branch-scoped. Items and prices are tenant-scoped with optional branch-level price overrides.
- **Terminal = a registered lane.** Bound to one branch at registration. Carries the receipt-number sequence.

Resolution order per request: tenant from the authenticated principal's tenant binding → branch from the request, validated against the user's grants → terminal from the registered terminal token where present. Any mismatch is a 403, not a silent narrowing.

### 2.2 System diagram and realtime transport

```
Lane client (Flutter Web, offline queue)  ─┐
Back-office client (Flutter Web)          ─┼─► API (Node/Express) ─► MSSQL
Owner client (Flutter Web, mobile layout) ─┘        │
                                                    ├─► SSE hub (one multiplexed stream)
                                                    └─► Scheduled ticks (env-gated)
```

**Realtime transport: SSE, one multiplexed stream per authenticated session.** Chosen over WebSockets because every realtime need here is server-to-client (a supervisor's approval queue, an owner's live sales tile, a terminal's price-list invalidation), and SSE survives corporate proxies that break WebSocket upgrades. Never one connection per feature.

### 2.3 Canonical folder structure

Backend and frontend follow checklist §3 and §4 exactly, with these project-specific additions: `services/engines/` holds the domain engines named in Part 4, one file per engine; `lane/` in the frontend holds the offline queue and its sync worker, and is the only place `IndexedDB` is touched.

### 2.4 Security layer

The ordered middleware chain from Part 1, with three-layer authorization: route-level permission, record-level tenant and branch predicate, and field-level redaction on responses. Approval-gated actions (void after tender, return, discount above threshold, shift close with variance) require a supervisor credential presented at the terminal and are recorded with both identities.

### 2.5 External integrations layer

Printers, scanners, and drawers are **client-side device concerns**, isolated behind one `DeviceService` in the lane client. The server never talks to a device. Receipt content is composed server-side and returned as a structured document; rendering to ESC/POS happens on the client. This is what keeps receipt content auditable and testable without hardware.

Accounting export is file-based, generated server-side, on demand.

### 2.6 Supported deployment topologies

| Topology | Use | Known limits |
|---|---|---|
| Single VM, single Node process | Pilot, up to ~5 client businesses | The in-process permission cache, the SSE hub map, the in-memory rate limiter, and the `setInterval` scheduler are all single-process. This topology is the one the standard's patterns assume. |
| Single VM, containerized, single app instance + separate DB host | Year-one production | Same single-process caveats. Restore drill required before go-live. |
| Multiple app instances behind a load balancer | Not supported in MVP | Requires: shared rate-limit store, SSE fan-out via pub/sub or sticky routing, and a DB job-lock table replacing the in-memory scheduler latch. Do not deploy this topology until those three exist. |

## Part 3 — DB Schema Architecture

**Naming.** Tables singular PascalCase, columns PascalCase, FKs `<Table>Id`. Money `DECIMAL(18,4)`. Quantities `DECIMAL(18,4)` — not INT, because a future weighed-goods requirement would otherwise force a schema migration across every movement table.

**Standard audit columns, inherited by every table:** `CreatedBy`, `CreatedAt`, `UpdatedBy`, `UpdatedAt`, populated from actor context, never from a controller argument.

**Deliberate exclusions with rationale**
- **No soft delete on Sale, SaleLine, Return, StockMovement, or ShiftReading.** These are financial and statutory records; they are never deleted, so a deletion flag would be a lie. Exclusion stated here because the next developer will otherwise "add it for consistency".
- **No temporal history tables on transactional documents**, since they are immutable already. Temporal history is applied to `Item`, `Price`, and `User` where retrospective questions are real.
- **No UoM conversion table.** PRD §2 excludes WMS behaviour; a conversion table would invite it.

### Selected tables (4 of 21)

**`Item`** — tenant-scoped catalogue.

| Column | Type | Notes |
|---|---|---|
| ItemId | INT IDENTITY PK | |
| TenantId | INT NOT NULL FK | tenancy predicate |
| Sku | NVARCHAR(50) NOT NULL | unique per tenant |
| Barcode | NVARCHAR(50) NULL | unique per tenant where not null |
| Name | NVARCHAR(200) NOT NULL | |
| CategoryId | INT NOT NULL FK → Category | reference table, maintained |
| UnitId | INT NOT NULL FK → Unit | reference table, maintained |
| TaxTreatmentId | INT NOT NULL FK → TaxTreatment | reference table, maintained |
| IsActive | BIT NOT NULL DEFAULT 1 | never hard-deleted while referenced |

*Indexes:* `(TenantId, Barcode)` unique filtered — serves the lane's scan lookup, the hottest query in the system. `(TenantId, IsActive, Name)` — serves lane search-by-name. `(TenantId, Sku)` unique — serves import and clerk lookup.
*Retention:* permanent.

**`Price`** — effective-dated, tenant-scoped, optional branch override.

| Column | Type | Notes |
|---|---|---|
| PriceId | INT IDENTITY PK | |
| TenantId, ItemId | INT NOT NULL FK | |
| BranchId | INT NULL FK | NULL = tenant-wide price |
| UnitPrice | DECIMAL(18,4) NOT NULL | money invariant |
| EffectiveFrom | DATE NOT NULL | DATE, not DATETIME — invariant 2 |

*Indexes:* `(TenantId, ItemId, BranchId, EffectiveFrom DESC)` — serves the pricing engine's "price in force on business date D" lookup; without it the lane's cart recalculation degrades on any tenant with pricing history.
*Retention:* permanent; superseded rows are the audit trail for RA 7394.

**`StockMovement`** — the only writer of on-hand. Append-only.

| Column | Type | Notes |
|---|---|---|
| StockMovementId | BIGINT IDENTITY PK | |
| TenantId, BranchId, ItemId | INT NOT NULL FK | both predicates |
| MovementType | NVARCHAR(20) NOT NULL | SALE, RETURN, RECEIPT, ADJUSTMENT, TRANSFER_OUT, TRANSFER_IN |
| Quantity | DECIMAL(18,4) NOT NULL | signed |
| BalanceAfter | DECIMAL(18,4) NOT NULL | computed inside the movement transaction |
| ReasonId | INT NULL FK → MovementReason | required for ADJUSTMENT and RETURN |
| SourceDocumentId | BIGINT NULL | the sale, return, or receipt that caused it |
| IdempotencyKey | NVARCHAR(64) NULL | unique per tenant; invariant 6 |

*Indexes:* `(TenantId, BranchId, ItemId, StockMovementId DESC)` — serves both current on-hand and movement history. `(TenantId, IdempotencyKey)` unique filtered — enforces replay safety at the database, not merely in code.
*Retention:* 7 years, then archive to cold storage. At 1.5M sale lines a year per mid-size client, this is the second-fastest-growing table.

**`AuditLog`** — cross-cutting, written on response finish.

*Indexes:* `(TenantId, CreatedAt DESC)`, `(TenantId, ActorUserId, CreatedAt DESC)`.
*Retention:* **the fastest-growing table in the system.** One row per mutating request, payload capped at 4 KB, route capped at 255 characters. Policy: 24 months hot, monthly partition, then archived and dropped. Without this policy the table reaches hundreds of millions of rows and every write slows down. Decided here, at design time, precisely so nobody has to decide it during an incident.

## Part 4 — Core Modules & Integration Mapping

### 4.1 Pricing & discount engine

**Purpose.** Given tenant, branch, item, quantity, business date, and any customer status, produce the line's gross, discount, tax, and net — as the single authority. No other code computes a price.

**Rules.**
1. Resolve the price in force: the newest `Price` row for the item where `EffectiveFrom <= businessDate`, preferring a branch-specific row over the tenant-wide row. If none exists, the item is not sellable and the lane refuses it with a clear message.
2. Apply line discounts.
3. Apply statutory senior/PWD treatment to the qualifying portion, per RA 9994 / RA 10754.
4. Apply VAT per the item's tax treatment.
5. Round **once**, half-up, to 2 decimals, at the end of the line computation. Line totals are then summed exactly; the document total is never independently rounded.

Steps 2→3→4 are in that order because the statutes fix it. Reordering produces centavo errors that fail reconciliation and are found weeks later.

**Inputs/outputs.** Pure function of its inputs; emits no events; performs no writes.
**Permission routes.** None — it is called by other engines.
**Implementing file.** `services/engines/pricingEngine.service.js`

### 4.2 Stock-movement engine

**Purpose.** The only writer of stock. Every quantity change in the system passes through here.

**Rules.**
1. A movement is inserted inside a transaction that also locks the item's current balance row for update, computes `BalanceAfter`, and writes it. Read-then-write without the lock oversells under concurrent lanes.
2. `ADJUSTMENT` and `RETURN` require a `ReasonId` from the maintained reason list.
3. A negative movement that would drive on-hand below zero is rejected unless the tenant's setting permits negative stock, which is off by default.
4. Replay of an existing `IdempotencyKey` returns the original movement and inserts nothing.

**Events emitted.** `stock.moved` on the SSE stream, branch-scoped.
**Permission routes.** `stock.receive`, `stock.adjust`, `stock.view`.
**Implementing file.** `services/engines/stockMovementEngine.service.js`

### 4.3 Shift & end-of-day engine

**Purpose.** Owns the business date, the shift lifecycle, and the X/Z readings.

**Rules.**
1. **The business date is set when a shift opens and is stamped onto every sale in that shift**, regardless of wall-clock midnight. This is invariant 2's trap made concrete.
2. No sale may be rung on a terminal with no open shift.
3. Z numbers come from the terminal's counter row, allocated inside the closing transaction. Gapless.
4. Expected cash = opening float + cash tenders − cash refunds − pickups. Variance outside the configured tolerance blocks close until a reason is entered.
5. A closed shift is immutable. Reprinting a Z reading re-renders the stored document; it never recomputes.

**Events emitted.** `shift.opened`, `shift.closed`.
**Permission routes.** `shift.open`, `shift.close`, `shift.readX`, `shift.readZ`.
**Implementing file.** `services/engines/shiftEngine.service.js`

*Remaining engines follow the same shape: 4.4 sale/tender engine, 4.5 return engine, 4.6 receipt-document engine, 4.7 reporting/aggregation engine.*

## Part 6 — Feature Development Guidelines

Named rules. A rule with a name gets cited in code review; an anonymous one gets forgotten.

### 6.1 The Business-Date Rule
Never derive a sale's business date from the server clock or the device clock. Take it from the open shift.
**Prevents:** the 00:30 sale landing on the wrong day, which makes a branch's Z reading disagree with the owner's consolidated report — a discrepancy that looks like theft and takes days to disprove.
**Edit:** `services/engines/shiftEngine.service.js`, `services/engines/saleEngine.service.js`.
**Enforcer:** structural lint — any `new Date()` inside `services/engines/` fails the build. Business dates come from the shift.

### 6.2 The Sequence Rule
Allocate receipt and Z numbers inside the same transaction as the document they number, from a locked per-terminal counter row.
**Prevents:** gaps in a BIR-mandated gapless sequence when a transaction rolls back. A gap is a regulatory finding, not a cosmetic defect.
**Edit:** `services/engines/receiptDocumentEngine.service.js`.
**Enforcer:** code-review item, plus a concurrency test that opens 20 simultaneous sales on one terminal and asserts a contiguous sequence.

### 6.3 The Movement Rule
`on_hand` is never written. Insert a `StockMovement`.
**Prevents:** the drift between the balance and its history that makes every stock investigation unanswerable.
**Edit:** `services/engines/stockMovementEngine.service.js` is the only file permitted to write the balance.
**Enforcer:** structural lint — `UPDATE` against the on-hand column outside that one file fails the build.

### 6.4 The Server Decides, the Client Renders
The lane never computes a total it then sends to the server. It sends lines; the server prices them and returns the document.
**Prevents:** a client-side rounding difference becoming a real financial discrepancy, and a tampered client submitting its own prices.
**Edit:** `lane/` submits line intent only; `services/engines/pricingEngine.service.js` is the authority.
**Enforcer:** code-review item. The submit payload's schema simply has no total field, which is the strongest available enforcement.

### 6.5 The Replay Rule
Every lane submission carries an idempotency key, and every handler that accepts one is safe to call twice.
**Prevents:** an offline lane's retry creating a duplicate sale — simultaneously a money bug, a stock bug, and a BIR problem.
**Edit:** `middleware/idempotency.js`, plus the engines' unique-key handling.
**Enforcer:** unique index at the database, and a test that submits the same key twice and asserts one document.

### 6.6 The Registry Rule
A new selection list means a new table, seeds, lookup allow-list entry, maintenance screen, permission routes, and menu entry — in the same change, or not at all.
**Prevents:** the hardcoded dropdown that a client asks to change on a Friday.
**Edit:** migration, `controllers/lookup.controller.js` allow-list, the generic maintenance screen's registration.
**Enforcer:** definition-of-done item 14 (checklist §9), plus the audit's failure class 13.
