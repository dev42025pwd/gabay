<script type="text/plain" id="src-start-here"># Engineering Standard — start here

> **Version**: 1.0 | **Date**: 2026-09-20

**What this is.** A checklist of how we build systems, earned mostly by things going wrong once. Most rules exist because something broke, and the rule says so. It is a standard, not a style guide: where it is specific, it is specific on purpose.

**Who owns it.** Allan Young, deputy Raphael Mendoza. Rule changes, deviations, and sign-offs go to either. Where a deviation is sought on a project the owner is working on, the deputy signs it.

---

## Read this much (about 20 minutes)

| Read | Why |
|---|---|
| `PRODUCT_LIFECYCLE.md` | What every other document is for. Read this first. |
| Checklist **§1** | The stack, and how we choose versions. |
| Checklist **§2** | The three documents every project carries. |
| Checklist **§9** | The definition of done. You will use this weekly. |
| Checklist **§14.1** | How a change travels: intent → spec → plan → diff → PR. |

That's it. The rest is reference material that arrives when you need it.

## Read this when you're doing that

| When you are… | Read |
|---|---|
| Touching schema or writing a migration | §3.9, §8.2, Blueprint Part 3 |
| Writing any query | §3.7, §3.11, §3.19 |
| Handling money or dates | §3.9, §3.10, Blueprint Part 1 invariants |
| Building a form, list, or picker | §3.19, §4.10, Appendix A.13 |
| Adding a route | §3.4, §3.5, §3.6, §3.8 |
| Closing out a feature | §9, and the pipeline's own §5 |
| Writing a PRD, Blueprint, or pipeline entry | Appendix B |

## Six things to know before you write any code

1. **Money is `decimal.js` and `DECIMAL(18,4)`.** Never a float, at any layer, ever.
2. **Every scoped query carries its tenant predicate**, taken from the request context, never from the JWT user object.
3. **No request-derived value is ever interpolated into SQL.** Sort keys, filters, and lookup names go through an allow-list map.
4. **Migrations are immutable once committed.** Changed your mind? New migration.
5. **No hardcoded option lists.** If a client could ever ask to add a value, it is a table with a maintenance screen.
6. **No colour literals outside the token file.** `primaryColor` resolves to `surface` in dark mode and paints things invisible.

## How this actually runs

A change moves as `intent.md` → `spec.md` → `plan.md` → diff → PR, each committed, each named by its pipeline entry ID. The pipeline is the index; it is not a second backlog.

Before you report anything as complete: run the verification command and paste the output. If a test fails, fix the code, not the test.

## If you disagree with a rule

Say so — that is how it improves. But say it as a change proposal: name the rule, name the incident or project that shows it is wrong, and name the enforcer the replacement would get. A rule with no incident and no enforcer is a preference, and preferences do not go in a standard.

If a rule is right but your project genuinely cannot meet it, that is an `EXCEPTIONS.md` entry — rule, reason, approver, **and an expiry date**. Exceptions without expiry dates become the standard by silence.

## What we are not doing yet

The eval suite (§7.2) is carved out of the next project. Everything else applies. One consequence: a shared skills plugin cannot be installed until evals exist, so §14 lands as `CLAUDE.md`, the verification command, hooks, and `REVIEW.md` — the plugin comes later.

<script type="text/plain" id="src-checklist"># New Project Standards Checklist

> **Version**: 1.0 | **Date**: 2026-09-20 | **Status**: Living document | **Owner**: Allan Young (deputy: Raphael Mendoza) | **Changelog**: §13
> **Audience**: Any Dynamiq team starting a new system (WMS, POS, inventory, billing, …)
> **Source**: Distilled from production experience — rules earned, mostly, by something going wrong once. **Self-contained**: every mandated pattern is described in place, and the hardest-to-reconstruct ones are given in full — working code in Appendix A (§10), document templates in Appendix B (§11). No external repository is required to apply this standard.
> **Existing projects**: audit against this checklist using the companion prompt in `PROJECT_STANDARDS_AUDIT_PROMPT.md`.
>
> **Citing this document**: normative sections are cited `§3.4`, `§8.5`. **Appendices are cited by letter — `Appendix A.9`, `Appendix B.1` — never by section number**, because appendices grow and section numbers must not move. §10 and §11 keep their numbers for historical reasons; any Appendix C onward takes a letter only and lives after the last numbered section.

**How to use this document:** copy it into the new repo's root on day one and tick boxes as you build. Items are tiered:

- **[P0]** — before the first feature is written (skeleton, guardrails, docs).
- **[P1]** — before the first internal release.
- **[P2]** — before production / first client.

Two conventions every rule below follows: **every rule names its enforcer** (a script, hook, or CI job — or states honestly that it's a code-review item), and **rules that came from an incident say so**, because "we lost data this way once" is what keeps a rule alive after the author leaves.

---

## 1. Mandated tech stack

The stack is a company standard, not a per-project choice.

**This table names choices, not version numbers.** A pinned version in a company document is correct on the day it is written and wrong within a year — and it fails quietly, because a team following the standard correctly ends up on something unsupported and did nothing wrong. So what this section mandates is the choice plus a **currency policy**; the version a project actually runs is pinned once in that project's Blueprint Part 1 and enforced by its committed lockfiles.

| Layer | Mandated choice |
|---|---|
| Frontend | Flutter Web (+ Flutter mobile if the product needs a field app) |
| State | `provider` **or** `riverpod` — one per project, chosen at project start (MVVM: View → ViewModel → Service) |
| HTTP | `dio`, single `ApiClient` singleton |
| Routing | `go_router` + `usePathUrlStrategy()` (no hash URLs) |
| Backend | Node.js + Express |
| DB | MSSQL via the `mssql` driver, raw parameterized SQL (no ORM) |
| Money math | `decimal.js` — **never raw JS floats for monetary values** |
| Auth | `jsonwebtoken` + `bcryptjs` (cost 10, one shared `utils/password.js`) |
| Hardening | `helmet`, `cors`, `express-rate-limit`, `multer` |

**Currency policy — what "which version" means:**

- **Node.js**: an LTS line **in active support on the day the project starts**. Never a line in maintenance-only, and never one past end of life. Read the official release schedule; do not copy what the last project used.
- **Flutter and Dart**: the current stable channel at project start.
- **Everything else**: the current stable major at project start, taken from the package registry rather than from another repo's manifest.
- **In flight**: a project stays on its pinned majors through a release cycle. Moving to a new major is a change like any other — it gets a pipeline entry, not a quiet bump.
- **Approaching end of support**: the upgrade becomes a pipeline entry *before* the date, not after. An unsupported runtime in production is a security finding (§6).

**Denied:** React/Vue/Angular, Python/PHP backends, PostgreSQL/MySQL/MongoDB, ORMs (Sequelize/Prisma/TypeORM), floating-point money, `moment` for new code (hand-rolled local-date helpers instead — §3.10).

- [ ] [P0] Stack matches the table; deviations approved by the lead in writing before the repo exists, and recorded in `EXCEPTIONS.md` with an expiry date.
- [ ] [P0] The versions actually chosen are pinned in **Blueprint Part 1** with the date they were chosen, and in the lockfiles, which are committed. The company standard says *what*; the project says *which*, once, reproducibly.
- [ ] [P1] Nothing in use is past its end-of-support date. This is checkable, so check it: a scheduled job reporting end-of-life status for the runtime and the top-level dependencies (§14.3).

---

## 2. Required documentation set

A project is not started until these files exist (even as stubs with the section skeletons filled in). Docs cross-reference each other by **stable numbered anchors** (`Blueprint §4.2`, `PRD §6.3`, `P0-01`) so a feature is traceable spec → roadmap → test case.

| Doc | Purpose | Skeleton |
|---|---|---|
| `<SYSTEM>_PRD.md` | Business *why*. Short (~100 lines). | 9 sections — full template in **Appendix B.1** |
| `<SYSTEM>_MASTER_BLUEPRINT.md` | Engineering source of truth. AI agents and humans must read it before schema/architecture work. | 6 parts — full template in **Appendix B.2** |
| `FEATURE_PIPELINE.md` | Living roadmap/status ledger. | Priority-tier sections (P0–P3); entries carry a stable ID (`P0-01`), Blueprint/PRD references, a fixed attribute table (Description / Why this tier / DB / Backend / Frontend / Effort / Dependencies / Status); full template in **Appendix B.3**, whose §5 carries the definition-of-done list from §9 below |
| `E2E_Test_Cases_Manual.md` | Exhaustive backend/API release gate. | §7.3 |
| `E2E_Frontend_Test_Cases_Manual.md` | Exhaustive UI release gate. | §7.3 |
| `Smoke_Test_Guide.md` | ~2-hour fresh-DB-to-all-modules pass. **Revised in place, never forked to `_v2`** — forked guides accumulate stale pointers, and nobody can tell which one is current. Design that out. | §7.4 |
| `README.md` | Stack, repo layout, doc index, **the one-time `git config core.hooksPath .githooks` step**, run/test commands. (A two-line README with the hooks step buried in `CLAUDE.md` means the hooks are never enabled on a fresh clone.) | — |
| `INSTALL.md` | Environment bring-up, with a **decision-router at the top** ("Docker? → here. Bare VM? → there. Multi-client? → there"). | — |
| `.env.example` | Every env key, heavily commented, committed. Real `.env` is refused by the pre-commit hook (§8.1). | — |
| `CLAUDE.md` | AI-agent operating contract (§8.4). | — |
| Deployment runbook | Phase-numbered, reusable per environment: prereqs → layout → build → DB + least-privilege login → env → reverse proxy → TLS (with a renewal reminder) → service supervisor with log rotation → firewall → verify → Operations (backups, canary updates) → Gotchas → Hard limits. | — |
| Per-release deploy plan | Dated, one per production release: version delta, **provenance of every claimed fact**, ⚠️ marker + approval gate on every writing step, migrations to apply, build, deploy, smoke, **rollback**, order of operations. | — |

Doc conventions (all docs):

- [ ] [P0] Front-matter block on every long doc: `Version | Date | Status | Audience | Scope/Estimated time`.
- [ ] [P0] Rules are written **incident-first** where an incident exists (what broke, when, symptom) — this is why they get read.
- [ ] [P0] State the **negative space**: what deliberately does not exist ("there is no revert-to-draft"), deliberate exclusions, inherited hard limits.
- [ ] [P1] Hand-maintained totals (test-case counts, etc.) are generated, not typed — they drift.

---

## 3. Backend architecture

### 3.1 App bootstrap — middleware order is load-bearing

- [ ] [P0] Order, verbatim: TLS options (fail fast — `process.exit(1)` on unreadable cert, **never silently downgrade to HTTP**) → `trust proxy` as a **hop count** from env (default 1), set *before* rate limiting or `req.ip` lies → `disable('x-powered-by')` → `helmet` → `cors` with an allow-list from `CORS_ORIGINS` (permissive fallback logs a loud warning) → body limits → audit logger → `/api` no-store cache headers (so a re-login can't render the previous user's cached data) → rate limiters → routes → static/uploads → SPA fallback → **DB connect first, then `listen()`** (exit 1 if unreachable).
- [ ] [P0] Body limit default **5 MB** (`MAX_JSON_BODY`), never a blanket 50 MB — a big global JSON limit is a memory-DoS amplifier; large payloads go through multer.
- [ ] [P0] Route-order review items: any unauthenticated mount (webhook ingest, OAuth callback, public logo) MUST be registered *before* a JWT-guarded `app.use` sharing the same path prefix. Code-review item — no linter catches it.
- [ ] [P1] Graceful shutdown: track live sockets in a `Set`, destroy on SIGINT/SIGTERM — long-lived SSE streams otherwise cause `EADDRINUSE` on restart.
- [ ] [P2] Compression: decide explicitly (edge proxy vs in-process) and write the decision down. Leaving gzip to nginx/Caddy is a fine answer; leaving it undecided is not.

### 3.2 Rate limiting — twice, differently

- [ ] [P0] Global limiter on `/api`: 60s window, generous ceiling (default 1200/min, env-tunable) — it keys on IP and a whole office NATs to one address.
- [ ] [P0] Auth limiter on login/verify: 15-min window, ~15 attempts, **`skipSuccessfulRequests: true`** so only failures burn budget.
- [ ] [P0] Exempt machine-cadence and held-open routes (webhooks, SSE) via a `skip` function; provide a `RATE_LIMIT=off` kill switch for the e2e suite.

### 3.3 Authentication

- [ ] [P0] JWT payload: `{ user_id, role, permissions[], session_id, <tenant id>, isSuperUser, … }`; expiry via `JWT_EXPIRES_IN` (default 8h). Query-string `?token=` fallback ONLY if the product needs `EventSource`/`<img>` auth — documented as a deliberate exception.
- [ ] [P0] bcrypt cost 10, centralized in one `utils/password.js` used by the app AND every provisioning script, so one compare path verifies every account.
- [ ] [P1] Login lockout: failed-attempt counter → lock, gated by a runtime setting; **make the max attempts a setting, not a magic number** — a hardcoded `3` in the controller means every threshold change is a deploy.
- [ ] [P1] Single-active-session enforcement (session id in JWT vs `active_session_id` column), toggleable at runtime; on `TokenExpiredError`, best-effort clear the server-side session so the user can re-login immediately.
- [ ] [P1] Forced password change (`ChangePassword` flag) + optional password expiry, both computed at login.
- [ ] [P1] Audit attribution on the tokenless login route: set the audit user id only *after* the password matches — a failed guess must never be stamped with the identity it guessed at.
- [ ] [P2] Decide whether you need a refresh-token flow, or whether expiry is a client-side timer. Either is defensible; write the decision down.

### 3.4 Authorization — three layers

**Layer 1 — roles (the floor).** A small closed role set (for example `ADM`/`MGR`/`EMP`) minted into the JWT. Middleware guards (`blockEmp`, `adminOnly`) plus inline assertion helpers for conditional gates.

**Layer 2 — permission bits (the rule).** `Group` + per-`User` tables of `route × CanCreate/Read/Update/Delete`; per-user rows REPLACE the group row; the identical merge runs at login and in the guard so screen and server can never disagree.

**Layer 3 — data scope.** Who may see *which rows*: self-scoping for ordinary users, hierarchy/ownership resolution for approvers/managers.

- [ ] [P0] `requirePermission(routes[], action)` guard with: in-process cache (30s TTL + bust-on-write), a **three-valued verdict** (allowed / denied / *unconfigured* — silence is "not configured yet", handled per `strict` flag), superuser/admin bypass, and **fail-closed 503 on lookup error** — a permission lookup that fails must not become an open door.
- [ ] [P0] Composition rule: role guard *in front of* permission guard on every mutating route.
- [ ] [P0] `resolveScopedEmployeeId`-style self-scoping on every list/read an ordinary user legitimately needs. **Never blanket-block a read the UI exposes** — that ships a visible-but-403 dead end.
- [ ] [P0] **URL-shaped CRUD**: routes end `/new`, `/:id/edit`, `/delete` so both the frontend router and reviewers can infer the required permission from the URL (§4.5).
- [ ] [P1] Rollout switch: a `permission_bits_enforced` runtime flag + `warnOnly` mode that logs `WOULD REFUSE` before anyone is locked out; **guard verdicts are written to the audit table**, not just logged.
- [ ] [P1] If the system has approvals/ownership: the notification fan-out and the authorization check MUST resolve from the same source (org hierarchy / record ownership), never from the role code. Incident this comes from: line managers were *notified* of requests, then *403'd* on opening them. Distinguish `null` (whole scope) from `[]` (nobody) in resolver return values.
- [ ] [P1] Parameterized IN-list helper (`@scope0..@scopeN` — Appendix A.5) — never string-interpolate an ID list into SQL.

### 3.5 Multi-tenancy (if the system serves more than one company/branch/site)

- [ ] [P0] Tenant id comes from the **JWT claim**, not a header. An `X-Company-ID`-style header override is honored only for superusers (branch switcher).
- [ ] [P0] `tenantContext` middleware sets `req.tenantCompanyID` after `verifyToken`; **controllers use `req.tenantCompanyID`, never `req.user.CompanyID`**. This has caused a tenant leak twice; it is not a style preference.
- [ ] [P0] Every query on a tenant-scoped table carries `WHERE CompanyID = @companyId` — including DELETEs. This is convention, not enforced by the DB; add a grep-based lint for tenant tables queried without the predicate. Convention without a lint is how the predicate goes missing.

### 3.6 Audit trail

- [ ] [P0] Global middleware, mounted before routes, firing for POST/PUT/DELETE only, writing on **`res.on('finish')`** — at middleware entry `req.user` doesn't exist yet, so a pre-handler write stores NULL actors on every row. That was a real bug, and it silently voided an entire audit trail.
- [ ] [P0] Row: `UserId, IPAddress (::ffff: normalized), Route (capped to column width), Method, PayloadDiff {body,query,params,status}` capped ~4 KB with a truncation marker.
- [ ] [P0] **Secret redaction before serialization** via a shared `redactSecrets` util: an *exact-key* set (`password`, `pin`, `otp`, `token`…), a *substring-stem* list (`password` catches `newPassword`), and a **`NEVER_SECRET` allow-list that wins outright** (`changePassword` the boolean flag must survive, or the trail hides the very action it exists to show). Shape preserved, depth-capped, never throws. One module shared by the live middleware and any historical scrubber.
- [ ] [P1] Noise filters: drop anonymous 404s (scanner traffic is otherwise an unauthenticated write path into your DB); keep authenticated 404s; skip high-cadence machine webhooks.
- [ ] [P0] Fire-and-forget with `.catch` — an audit write must never delay or fail the request it describes. (Appendix A.3–A.4.)

### 3.7 Input validation

- [ ] [P0] **Adopt a schema validator** (`zod` or `joi`) as route middleware for request bodies. Manual guard clauses per handler drift apart and miss cases; a validator at the route boundary does not.
- [ ] [P0] Regardless of validator: **sort keys and any SQL identifier from the client go through an allow-list map** (`sortMapping[key] || default`) — identifiers can't be parameterized.
- [ ] [P0] Semantic/privilege guards live in the controller even with a schema validator: only a superuser may grant or clear the superuser flag; a delegated create-grant must not allow self-escalation.
- [ ] [P1] Lenient parsing for filters: a malformed date query param disables the filter (`null`) rather than 500ing.

### 3.8 Error handling

- [ ] [P0] Standardize ONE error body shape — `{ error: "message" }` — everywhere — a codebase that mixes `{error}`, `{message}`, and bare strings forces every client to handle three shapes.
- [ ] [P0] SQL/driver errors: log server-side, return generic `Internal server error`. Raw driver text is *inspected* (e.g. error 2627/2601 → 409 with a human message) but never echoed to the client.
- [ ] [P1] Domain errors carry `err.httpStatus` so services can throw a 409 without an error-class hierarchy.
- [ ] [P1] Router-scoped normalizer for multer errors (plain `Error` → 400 JSON, not a 500 stack).
- [ ] [P0] The backend error contract is `res.status(4xx).json({error})` — the frontend's `formatApiError` (§4.3) depends on it.

### 3.9 DB layer

- [ ] [P0] Parameterized queries ONLY: `.input(name, sql.Type, value)` + `@name`, explicit types always. `OUTPUT inserted.*` to return generated rows in one round-trip.
- [ ] [P0] Transactions for multi-statement writes: `begin → try { … commit } catch { rollback; throw }`. For optimistic concurrency, **re-read the row inside the transaction** and 409 if it changed.
- [ ] [P0] Money: `Decimal.set({precision: 18, rounding: ROUND_HALF_UP})` once per module; all arithmetic in `Decimal`; `.toNumber()` only at the `sql.Decimal(18,4)` binding boundary.
- [ ] [P0] Pool config explicit; `requestTimeout` raised from the 15s default (bulk writes legitimately run longer); named-instance `HOST\INSTANCE` split into `options.instanceName`.
- [ ] [P0] Boot log prints server/db/user — **never the password**.
- [ ] [P0] Decide `useUTC` up front and derive the date discipline from it (§3.10). Timestamp/date column DEFAULTs must match (local `SYSDATETIME`, not `SYSUTCDATETIME`, if `useUTC:false`).

### 3.10 Dates & timezone (a whole class of shipped bugs — treat as first-class)

- [ ] [P0] One `utils/dates.js` with: `dateOnly()`, **`projectDates([cols])` row-mapper applied at the service boundary for every DATE column before `res.json`** (otherwise `JSON.stringify → .toISOString()` shifts dates a day in any non-UTC zone), `toLocalDateOnly()` for *binding* date strings, and local-ISO formatters.
- [ ] [P2] Deployment timezone is part of the deploy runbook: `TZ` + `tzdata` in Docker (Alpine ships no zoneinfo — a bare `TZ=` is silently ignored), `Set-TimeZone` on Windows/NSSM. Server clock wrong = domain math wrong.

### 3.11 Pagination (server-side, always)

- [ ] [P0] Query contract: `page` (1-based), `pageSize`, `search`, `sortBy`, `sortOrder`, per-column filters. Response envelope: `{ items, totalCount, page, pageSize }`.
- [ ] [P0] `COUNT(*)` and the page query share ONE built `whereClause` and one bind closure, so paging, counting and filtering can never disagree about the row set. `OFFSET/FETCH` for the page.
- [ ] [P0] Filtering lives on the server; the frontend's filter keys mirror the backend's. Never "load all rows, filter in memory".

### 3.13 Notifications fan-out (if the system notifies people)

- [ ] [P1] ONE choke-point function for all channels (DB row, SSE, push, email). Per-recipient channel preferences **only ever narrow**, never widen. Push/email are fire-and-forget — a push failure never blocks the in-app row.
- [ ] [P1] Fan-out uses `Promise.allSettled`; one recipient's failure never blocks the rest; log loudly when a fan-out resolves **zero** recipients (silent no-delivery is the worst failure mode).

### 3.14 Scheduled jobs (no cron library)

- [ ] [P1] Uniform pattern per job: exported `startAutoX()/stopAutoX()` pair, re-entrancy guard, **env gate first** (`X_AUTO=1`, default OFF), `setInterval(tick, 60_000)` + an hour-of-day check + a `lastRunDate` latch (runs once per day despite 1440 fires), whole tick in try/catch, per-tenant inner try/catch, re-checks its runtime flag each run. Started only after the DB connects.

### 3.16 Config, env & secrets

- [ ] [P0] `dotenv` line 1 of the server; every CLI script loads `.env` by **absolute path** (`path.resolve(__dirname, …)`) so cwd doesn't matter.
- [ ] [P0] Committed, heavily commented `.env.example`; real `.env` blocked by the pre-commit secret guard (§8.1). Incident this comes from: a leaked `.env` in git history — DB password and encryption key — forcing a full credential rotation and a history rewrite.
- [ ] [P0] **Fail fast on missing security config**: absent/short encryption key or unreadable TLS cert = `process.exit(1)` with an explanation. A silent random-key fallback is silent permanent data loss. Dev escape hatch must be an explicit, never-default env var.
- [ ] [P0] Runtime-changeable flags live in a `GlobalSettings` DB table, NOT env: frozen `DEFAULTS` map (each default's rationale commented — security flags default on, new modules default dark), 30s TTL cache + invalidate-on-write, resolvers that **never throw** (any DB error returns the safe default so auth still works), a `PUBLIC_FLAGS` allow-list for what non-admin users may read, and a pre-auth `getPublicConfig()` that returns `{}` on error.
- [ ] [P1] PII at rest (if applicable): AES-256-CBC, random IV per value, `iv:ciphertext` storage; `decrypt()` passes non-encrypted values through so gradual migration works; rotation + exposure-check scripts exist from day one.

### 3.17 Webhook ingest (machine-to-machine, no JWT)

- [ ] [P1] Per-source shared secret; HMAC-SHA256 over the **raw request bytes** (capture via `express.json({verify})` — signing a re-serialization of `req.body` breaks on key-order differences); compare with `crypto.timingSafeEqual` + length guard, never `===`.

### 3.18 Cross-cutting: actor context

- [ ] [P0] `AsyncLocalStorage` actor context: `runWithActor(userId, next)` in the auth middleware; services call `getActorId()` to stamp `CreatedBy`/`UpdatedBy` **without threading a userId argument down every call graph**. Returns `null` outside a request (cron/seeds), correctly leaving the columns NULL. The single highest-leverage pattern in this document. (Appendix A.1.)

### 3.19 Lookup & reference data

The frontend rule that forms are projections of the schema (§4.10) is unimplementable without uniform endpoints underneath it. Five bespoke dropdown endpoints produce five picker implementations.

- [ ] [P0] **ONE lookup controller, one URL shape**: `GET /api/lookups/:name?search=&page=&pageSize=&parentId=` returning the standard pagination envelope (§3.11) of `{ id, label, isActive }`. Per-feature `/departments/dropdown`-style endpoints are prohibited.
- [ ] [P0] The `:name` → table/column mapping is an **allow-list map in the controller** — the same identifier-allow-list rule as sort keys (§3.7). A lookup name from the client that indexes straight into a table name is SQL injection with a friendly face.
- [ ] [P0] Lookup queries are tenant-scoped (§3.5) and permission-guarded like any other read; a lookup used by a form must be readable by **every role that can open that form** (§3.4's never-blanket-block rule) — otherwise the form cannot be submitted at all.
- [ ] [P0] `search` is server-side and paginated. There is no "return all rows" mode, and no endpoint that becomes one when `pageSize` is large — cap it.
- [ ] [P1] Lookup tables carry `IsActive` and are **never hard-deleted** while any FK references them. Deactivation is the operation; deletion is blocked by the constraint and surfaced as a 409 naming the referencing table (§3.8).
- [ ] [P1] Lookup responses are cacheable: short in-process TTL, busted on write to the underlying table, same shape as the permission cache (§3.4). Note the single-process caveat if you ever run more than one instance.
- [ ] [P1] Every lookup table appears in **both seeds** — demo seed for development, statutory/reference seed for `--bootstrap` (§8.2) — because a form whose picker is empty on a fresh install looks broken, and the first person to hit it will hardcode a value to unblock themselves.

## 4. Frontend architecture (Flutter Web)

### 4.1 Structure

- [ ] [P0] `lib/` has exactly: `core/` (config, network, app-wide services, theme), `shared/` (components, widgets, utils, navigation), `features/<domain>/` with the fixed shape `models/ services/ viewmodels/ views/ (+widgets/)`, optional `mobile/` (own theme, changelog, version), and one `main_<surface>.dart` per shipped surface — never `if (kIsWeb)` forks inside a shared widget tree.

### 4.2 State management (MVVM)

**Pick `provider` or `riverpod` at project start; never both.** The layering is the same either way — View → ViewModel → Service, with the service stateless and the ViewModel owning `isLoading` and `String? error`. What differs is only how a ViewModel is reached and rebound. Record the choice in Blueprint Part 1's stack constraints so the agent and the next developer both know which idiom this repo uses; a codebase carrying both ends up with two sources of truth for the signed-in user, which is the bug this rule exists to prevent.

**Both, always:**

- [ ] [P0] ViewModels constructor-inject a stateless service plus the auth state, expose `isLoading` + `String? error`, and set `error = formatApiError(e)` in every catch.
- [ ] [P0] Any ViewModel holding per-account data implements `syncAuthUser`: compare bound `(userId, tenantId)`, early-return on mere token rotation, otherwise wipe cached state — or a logout→login in the same tab shows the previous account's data. Also covers the tenant/branch-switch reset.
- [ ] [P0] Auth-dependent state **re-binds rather than rebuilds** on a token rotation. Rebuilding drops in-flight requests and cached lists on every refresh; the symptom is a list that blanks itself every few minutes and nobody can reproduce it on demand.
- [ ] [P0] There is exactly ONE source of truth for the signed-in user, the tenant, and the branch, and everything else reads from it.

**If `provider`:**

- [ ] [P0] Root `MultiProvider` order: theme VMs → `AuthViewModel` (its `update` wires the ApiClient callbacks and `onAuthSuccess`/`onAuthCleared`) → message VM → feature VMs.
- [ ] [P0] ViewModels are `ChangeNotifier`s; auth-dependent ones use the proxy idiom: `update: (_, auth, vm) { vm ??= XViewModel(auth); vm.authViewModel = auth; return vm; }` (Appendix A.12).

**If `riverpod`:**

- [ ] [P0] One `ProviderScope` at the root. Providers are declared at file scope and typed; no global mutable singletons behind them.
- [ ] [P0] Auth-dependent providers take their dependency by `ref.watch` of the auth provider, so a token rotation rebinds the dependency without disposing state that is still valid. Where a provider must survive across a rotation, it is kept alive explicitly rather than by accident of being read.
- [ ] [P0] Async state uses `AsyncValue` rather than hand-rolled `isLoading` + `error` flags — but the error string still comes from `formatApiError(e)`, and raw exception text never reaches the UI (§4.3).
- [ ] [P0] `ref` is not passed into services. Services stay stateless and framework-free, so they can be tested without a container.

### 4.3 Networking

- [ ] [P0] ONE `ApiClient` Dio singleton. Token and tenant id are injected via **callbacks** (`tokenProvider`, `companyIdProvider`) assigned once at the root — the client never imports a state-management package or auth code. This is what keeps §4.2's choice from leaking into the network layer, and it is why either option works without touching this file.
- [ ] [P0] Interceptors: debug-only logger → tenant + auth header injection (per-call `Authorization` override wins) → 401 handler that skips login/verify paths and calls a single `onUnauthenticated` callback.
- [ ] [P0] Services are thin and stateless, rethrow the original `DioException`; **all user-facing error text goes through `formatApiError()`** (backend `{error}` body → friendly status-code copy → exception type), with a `sanitizeErrorText()` safety net inside the central `showError` so no call site can leak `DioException: …` to a user. Never interpolate `$e` into UI text.

### 4.4 Auth & session (client)

- [ ] [P1] Charts: wrap `fl_chart` in `shared/widgets/charts/`; feature code never imports the chart engine directly.

- [ ] [P0] Material 3 `ColorScheme.fromSeed` per brightness, one build function for light+dark.
- [ ] [P0] **Never `ThemeData.primaryColor`, never hardcoded `Colors.black/grey/white`** — `primaryColor` resolves to `surface` in dark mode and paints things invisible. Two shipped bugs came from this. Always `Theme.of(context).colorScheme.*`.

### 4.8 Versioning & changelog (in-app)

- [ ] [P0] `AppVersion` constants fed by `--dart-define` (`APP_VERSION`, `BUILD_NUMBER` = `git rev-list --count HEAD`, `GIT_COMMIT`, `BUILD_TIME`) with committed fallbacks; independent version streams per surface (web vs mobile) if both ship.
- [ ] [P0] `ChangelogEntry` list, newest first, plain-language end-user bullets — no table names, endpoints, or raw commit messages. Top entry's `version` and `date` are **auto-stamped by the pre-commit hook, never hand-authored** (§8.1).
- [ ] [P1] Version badge (login + footer) and a what's-new dialog whose "Current" marker matches the running version constant exactly.

### 4.9 Config & feature flags (client)

- [ ] [P0] One `AppConfig.apiBaseUrl` with strict precedence: `--dart-define=API_BASE` → sensible per-mode defaults, and a `kReleaseMode` guard so **a define-less release build can never silently target localhost**.
- [ ] [P1] Server-driven flags VM loaded at shell mount, each flag documenting its **fail direction** (module gates fail closed; behavior toggles may fail open because the backend enforces anyway); router and sidebar consume it only after `loaded`.
- [ ] [P1] Build-time flags via `bool.fromEnvironment` so tree-shaking strips the disabled branch; sensitive-permission features ship OFF in release with the manifest entry stripped.

### 4.10 Form fields & selection inputs — the schema decides, not the screen

**Governing principle:** *the schema is the contract; a form is a projection of it.* A field's widget, its validators, its length limit, its precision, and its option source are all **derived from the column it writes to**, resolved once in `shared/forms/`, and never hand-picked in a feature's view file. A hand-built form is N independent chances to disagree with the column it writes to, and the disagreements do not surface in review — they surface as a 500 on save, a date one day off, or a truncated address. Two shipped bugs came from exactly this: a free-text field longer than its `NVARCHAR(50)` column, and a date field that sent a timestamp into a `DATE` column and landed a day early (§3.10).

- [ ] [P0] **One `FieldSpec` descriptor per form field** (name, kind, required, maxLength, scale, lookup route, dependsOn, readOnly) and ONE resolver that turns a spec into a widget + validators. Feature views declare specs; they never instantiate a `TextFormField` directly. (Appendix A.13.)
- [ ] [P0] **Widget by column type, no exceptions:**

  | Column | Widget | Load-bearing detail |
  |---|---|---|
  | `DATE` | date-only picker | Emits `yyyy-MM-dd`, never a timestamp, never a raw `DateTime.toIso8601String()` — that is the §3.10 bug on the client side. |
  | `DATETIME2` | date + time picker | Local display, explicit about what it transmits; consistent with the `useUTC` decision from §3.9. |
  | `INT` / `BIGINT` | numeric input, integer keyboard | No `parse` on raw text without a guard; a malformed value clears the field, never throws. |
  | `DECIMAL(p,s)` | numeric input constrained to `s` decimal places | Money additionally: never client-side float arithmetic, and the client's rounding must match the server's `ROUND_HALF_UP` (§3.9) or the total the user sees is not the total that saves. |
  | `BIT` | switch or checkbox | **Never a Yes/No dropdown** — a three-state UI over a two-state column invents a null nobody can save. |
  | `NVARCHAR(n)` | single-line text, `maxLength: n` | The client must not permit a value the column will refuse. |
  | `NVARCHAR(MAX)` | multiline text | With an explicit soft cap; "MAX" is not an invitation. |
  | FK column | **single-select picker** | Cardinality comes from the schema (below). |
  | Junction/bridge table | **multi-select picker** | Same. |

- [ ] [P0] **Single vs multi is read off the schema, not chosen by the designer**: one FK column on the row = single select; a junction table (`OrderTag`, `UserRole`) = multi-select. If a screen "needs" multi-select on a single FK column, the schema is wrong — fix the schema, not the widget.
- [ ] [P0] **Validators are derived, not authored**: `required` mirrors `NOT NULL`; `maxLength` mirrors the column width; numeric range mirrors the type and any CHECK constraint. Hand-written `'Required'` strings are already banned (§4.6); hand-decided requiredness is banned for the same reason — the column already knows.
- [ ] [P0] **FK pickers always use the async server-search picker** (§4.6), even when the lookup has eleven rows today. A load-all picker is correct until the table grows, and nobody comes back to change it. One widget for the 11-row list and the 400,000-row list.
- [ ] [P0] **Every FK picker is tenant-scoped server-side** (§3.5, §3.19) and readable by the roles that can reach the form. A picker the user is 403'd on is the visible-but-403 dead end (§3.4, §4.5) in its most annoying shape.
- [ ] [P0] **Read-only columns render read-only**: identity, computed columns, and the `CreatedBy`/`UpdatedBy`/timestamp audit stamps (§3.18) are never form inputs. They are displayed or omitted; they are not typed.
- [ ] [P0] **Attachment fields take their accepted MIME set and size cap from ONE shared config** with the backend's multer allow-list (§3.15). Two lists drift, and the drift shows up as a file the user was allowed to choose and the server refused.
- [ ] [P1] **Cascading pickers**: a dependent picker is disabled until its parent has a value, clears itself when the parent changes, and filters **server-side** by the parent id. Never fetch all cities and filter by province in memory (§3.11's rule, applied to pickers).
- [ ] [P1] **Inactive lookup values — the rule that prevents the nastiest bug in this family.** Lookup tables carry `IsActive`. Pickers offer **active rows only**. But a form editing a historical record whose FK now points at a deactivated row MUST still display that value, marked inactive, and MUST NOT silently clear it on save. Deactivating a lookup value must never rewrite history: deactivate one department, and otherwise every past record silently loses its department on the next unrelated edit.
- [ ] [P1] **Lists and filters show the label, operate on the join.** A list column displays the lookup's display field, and sorting/filtering that column sorts and filters on the joined label **server-side** — never on the raw FK integer, never client-side. The filter widget for an FK column is the **same picker** as the form's, built from the same `FieldSpec`.
- [ ] [P1] **Uniqueness and FK-constraint failures are human**: a duplicate maps to the 409 from §3.8 with a message naming the field; a delete blocked by an FK reference returns a message naming *what is using it*, not `Internal server error`. The picker and its error path are one feature — a user who cannot tell why the save failed will invent a workaround.

**No hardcoded selection values.** This is the rule with the longest tail, because a hardcoded list is invisible until a client asks to change it and the answer is "that needs a deploy."

- [ ] [P0] **The test:** *could a client, a regulator, or the business ever ask to add, rename, deactivate, or reorder one of these values?* If yes, it is a **table with a maintenance screen**, not a constant. Departments, branches, categories, unit-of-measure, payment methods, document types, status sets, tax codes, reason codes, leave types, item classes — all tables. Every one of them.
- [ ] [P0] A new lookup table ships **complete or not at all**: table + seed rows + lookup allow-list entry (§3.19) + maintenance screen (list + form via the shared scaffolds) + permission routes seeded + menu entry. A table with no maintenance screen is a hardcoded list with extra steps, and the next request for a new value goes to a developer with SQL access. (Wired into §9.)
- [ ] [P0] The **narrow exception** — genuinely closed sets fixed by code or law (ISO country codes, the role code set from §3.4, statutory brackets that change by legislation and require code anyway) — lives in ONE shared constants file, and **each set carries a comment stating its authority and why it is closed**. An uncommented option list in a view file is a defect, exactly as a `0xFF` literal outside the token file is (§4.7).
- [ ] [P1] Sets that are closed *today* but plausibly business-extensible *tomorrow* default to a table. The cost of a table you did not need is one migration; the cost of a constant you needed to be a table is a release.
- [ ] [P1] Lookup labels are **not** the primary key and not the join key. Renaming "Warehouse A" to "Main Warehouse" must not touch a single row of transactional data.

## 6. Security release gate (consolidated — sign off before production)

- [ ] TLS fails fast; HSTS when terminating in-process; `trust proxy` hop count correct for the real topology
- [ ] Both rate limiters active and tested (auth limiter actually counts only failures)
- [ ] Secret guard hook active; no real `.env` ever committed; encryption key present and non-default
- [ ] Audit trail attributing correctly (spot-check rows for real UserId + status), redaction verified against a payload containing `password`, `newPassword`, AND `changePassword` (the flag must survive)
- [ ] Permission guard fail-closed verified (kill the DB mid-session → 503, not open door); IP-whitelist-style guards have their fail-open/fail-closed choice written down per guard
- [ ] Privilege-escalation guards tested: non-superuser cannot set/clear superuser; delegated create-grant cannot self-escalate
- [ ] Upload posture reviewed per directory; generated filenames only; MIME allow-lists in place
- [ ] **SQL — graded by reachability, not by a single count.** The absolute bar applies where user input reaches the query; the rest is debt that must shrink rather than a gate that blocks:
  - **Blocking, no exceptions**: no request-derived value (`req.query`, `req.body`, `req.params`, a sort key, a filter, a search term) is ever interpolated into query text. Every one of these is parameterized, and every identifier — sort column, order direction, lookup name (§3.19) — passes through an allow-list map.
  - **Blocking**: nothing in `api/controllers/` or `api/routes/` builds query text by interpolation, whatever the source of the value.
  - **Ratcheted, not blocking**: interpolation elsewhere (services, migrations, seed and maintenance scripts, usually of hardcoded identifiers) is counted at a baseline that may fall and must never rise. A release is not blocked by the existing count; it is blocked by an increase.
  - *Why graded.* A gate stated as "100% parameterized" against a codebase with hundreds of legacy sites is a gate that gets waived on its first use, and a gate waived once is read as decorative from then on. Grading it puts an absolute bar exactly where injection actually happens and turns the remainder into a number that goes down. Measured against a mature codebase, a flat rule proved unmeetable: hundreds of interpolation sites, of which only the request-derived subset was real exposure.
- [ ] Error responses leak no driver text, stack, or schema names
- [ ] **Every gate in this list actually gates.** A check that runs but cannot fail the build is worse than no check, because it buys the appearance of enforcement. Verify for each: does a violation return a non-zero exit, and does the pipeline stop? (Seen in practice: `flutter analyze` running in CI behind `--no-fatal-warnings --no-fatal-infos`, so existing lints and every new one were unable to fail anything; and an e2e workflow set to dispatch-and-nightly only, so it never guarded a merge.)
- [ ] Webhooks: HMAC over raw bytes, `timingSafeEqual`
- [ ] Production DB access rules written down. A workable default: production is SELECT-only without explicit per-request permission, and the e2e suite and seed scripts are permanently banned from it.

## 7. QA workbook & testing

### 7.1 Automated e2e suite

- [ ] [P0] HTTP-driven suite against a running server + deterministically seeded DB. A ~40-line harness (assert/phase/api with `validateStatus: () => true`, so 403/409/404 are assertable outcomes) is acceptable; a framework is equally acceptable; what is mandated is the **shape**: one `phase` function per module, all awaited from `main()`, phase names mirroring the manual's phases, exit code = failure count.
- [ ] [P0] Deterministic seed contract: a pinned env var (`SEED_MONTH_DELTA=0` pattern) documented at the top of the suite AND in the manual; named test accounts; a "key test records" table whose scenarios are the fixtures assertions rely on.
- [ ] [P1] Declarative CRUD+audit sub-suite: every module contributes a spec object (`create/update/cleanup/audit`) to a `tests/crud/*.crud.js` loader — coverage without test code, and it verifies `CreatedBy`/`UpdatedBy` stamping for free.

### 7.2 Structural linters — encode your catastrophic mistakes as scripts

## 8. Process & guardrails

### 8.1 Git hooks (`.githooks/`, enabled by `git config core.hooksPath .githooks` — **in the README**)

`pre-commit` guards, each commented with the incident it prevents:

- [ ] [P0] **Secret guard, pure shell** (fires even without node): refuse any staged `.env*` except `.example/.sample/.template/.dist`.
- [ ] [P0] **Version bump + changelog stamp** (never blocks): bumps only the surface(s) the commit touched; overwrites the top changelog entry's version and **stamps its date from the real commit time via Node ICU** (shell `date` lies about TZ on Windows) — which is why changelog dates are never hand-authored.
- [ ] [P0] **Changelog duplicate guard**: refuses a commit with a repeated entry (version/date ignored in comparison, since the bump renumbers copies).
- [ ] [P0] **Conditional structural linters** keyed to staged paths (schema linter only when `schema.sql` staged, etc.).

### 8.2 Schema & migration discipline

- [ ] [P0] `schema.sql` is the canonical current shape and **stays re-runnable**: dynamic FK-drop preamble, temporal teardown, then an explicit drop block (children before parents), then creates. **Every `CREATE TABLE` has a matching `DROP TABLE`** — enforced by a linter in `test:syntax` + pre-commit; the linter cannot check drop *order*, which stays a review item.
- [ ] [P0] Migrations are **additive history, never edited after the fact**; every schema change = a new migration file AND the `schema.sql` reflection. **Zero-pad migration numbers** — unpadded, `100_` sorts before `19_` and the run order silently changes.
- [ ] [P0] Migrations idempotent (safe as catch-up on an existing DB); each has a thin runner that splits on line-anchored `GO`, applies, then **runs a verification query and prints the result** — the operator sees the effect, not just "applied".
- [ ] [P0] One `setup-db` orchestrator: dev mode (schema → migrations → demo seed) and `--bootstrap` mode (schema → statutory/reference seed → tenant provisioning CLI), with `--stop-on-error` and granular `--skip-*` flags.

### 8.3 CI (three workflows)

- [ ] [P1] Fast always-on lint: `test:syntax` + `flutter analyze` (tolerances justified in a comment) + cheap doc-wiring greps (e.g. "every `async function phase` is awaited from `main()`"; pipeline entries missing DONE markers emit warnings).
- [ ] [P1] Heavy scheduled/dispatch e2e: provision real MSSQL from `schema.sql` + seeds, health-poll the backend, run the suite, **upload the server log as an artifact on failure**, with the workflow's cost stated in a header comment.
- [ ] [P2] Build-and-push gated on lint, stamping `APP_VERSION`/`BUILD_NUMBER`/`GIT_COMMIT`/`BUILD_TIME` as build args.

### 8.4 AI-agent directive (`CLAUDE.md`)

- [ ] [P0] Written on day one with: role/domain assignment, required-reading pointer to the Blueprint, the 2–3 absolute constraints (stack allow/deny, money math, domain-jurisdiction rules), the **companion-file sync table** (below), changelog/versioning rules, migration immutability, schema-drop rule, and the response-style contract. Every rule points at its enforcer or names its incident.
- [ ] [P0] **Keep it under a page.** The agent reads all of it at the start of every session, so anything stale is spending context for nothing. The bulk of this standard does not belong here — it belongs in skills that load on trigger (§14). `CLAUDE.md` points; skills carry.
- [ ] [P0] A **verification block** naming the one command that checks the work and what healthy output looks like, plus the standing instruction: run it before reporting any task complete, paste the output, and when a test fails fix the code rather than the test.
- [ ] [P1] A **things-the-agent-gets-wrong-here** list, seeded from Blueprint Part 1's known-traps block. Working rule: when the agent makes the same mistake twice, the correction goes in. When the same mistake recurs across repos, it graduates from `CLAUDE.md` to a skill.

### 8.5 Companion-file sync table — the single strongest process idea

- [ ] [P0] A `| File | Update when |` table naming, for each kind of code change, every doc/test/seed file that must move with it (schema, seeds, e2e suite, both manuals, blueprint, pipeline, changelog). Governing rule: *evaluate every row before marking work done; update in the same turn, or state in one line why not — considered, not forgotten.*

Everything that steers an agent is reviewed like code, or it is not a control.

## 9. Per-feature definition of done

Adapt into `FEATURE_PIPELINE.md` §5. A feature is DONE when every item below is satisfied.

**Every item carries its enforcer.** A fifteen-item list checked by memory does not survive parallel agent sessions — the third concurrent session skips it, and that is arithmetic, not indiscipline. The `Human` rows are the ones that are genuinely unmechanizable; if that column grows past four rows, something in it has an enforcer nobody has written yet.

| # | Item | Enforcer |
|---|---|---|
| 1 | `schema.sql` updated (with drops) + new migration file | Hook (blocks edits to a committed migration; requires teardown with a `CREATE TABLE`) + CI |
| 2 | Seed data updated (demo + statutory as applicable) | `REVIEW.md` compliance pass |
| 3 | Backend routes guarded: role guard → permission guard → tenant scope → validation | Structural lint + `REVIEW.md` security pass |
| 4 | Menu/permission rows seeded for the new routes; menu tree updated | `REVIEW.md` compliance pass |
| 5 | Frontend: list via the shared scaffold, form via the shared scaffold, errors via `formatApiError`, all four list states present | Lint (bare `TextFormField`, raw exception interpolation) + `REVIEW.md` |
| 6 | Notifications/SSE wired if the feature notifies anyone (fan-out resolves ≥1 recipient in the demo seed) | e2e suite |
| 7 | List-refresh-on-return verified (`didPopNext`) | e2e suite |
| 8 | Dark mode pass (no `primaryColor`, no hardcoded colors) | Structural lint |
| 9 | Automated e2e phase added AND awaited from `main()`; CRUD spec added to the declarative sub-suite | CI doc-wiring grep (§8.3) |
| 10 | Both E2E manuals + smoke guide rows added | `REVIEW.md` compliance pass |
| 11 | Changelog entry drafted (top of list, placeholders for version/date) | Stop hook + pre-commit pair (§8.5) |
| 12 | Companion-file sync table walked, each row updated or explicitly waived | Commit hook + `REVIEW.md` |
| 13 | Every form field declared as a `FieldSpec`; drift linter passes; no bare `TextFormField` in the feature's views (§4.10) | Hook — drift linter runs after any Flutter file edit |
| 14 | Every new enumerable set is a table with seed rows (demo + statutory), a lookup allow-list entry, a maintenance screen, permission routes, and a menu entry — or an entry in the shared constants file with its authority commented (§3.19, §4.10) | `REVIEW.md` compliance pass |
| 15 | Inactive-lookup-value case exercised once: deactivate a referenced lookup row, open a historical record, save it, confirm the value survives | Test case in the verification command |

**Human, and only these:** does the change do what `plan.md` said it would; is the residual risk acceptable; is the tier still right; and does anything here belong in Blueprint Part 6 as a named rule.

## 10. Appendix A — canonical code patterns

The patterns below are the hardest to reconstruct from prose alone. Copy them verbatim (rename domain words), then adapt.

### A.1 Actor context — `CreatedBy`/`UpdatedBy` without argument threading

```js
// utils/requestContext.js
const { AsyncLocalStorage } = require('async_hooks');
const als = new AsyncLocalStorage();
const runWithActor = (userId, fn) => als.run({ userId }, fn);
const getActorId = () => als.getStore()?.userId ?? null; // null outside a request (cron, seeds) — columns stay NULL, correctly
module.exports = { runWithActor, getActorId };

// authMiddleware, after the JWT verifies:
return runWithActor(decoded.user_id, () => next());

// any service, any depth — no userId parameter anywhere:
request.input('__actor', sql.Int, getActorId());
// ... SET UpdatedBy = @__actor
```

### A.2 Permission guard — three-valued verdict, fail-closed

```js
// verdict: { allowed, unconfigured, exempt } — silence means "not configured yet", not "no"
function requirePermission(routes /* array: several screens share one endpoint */, action, { strict = false } = {}) {
  return async (req, res, next) => {
    try {
      if (req.user.isSuperUser || req.user.role === 'ADM') return next();
      const v = await evaluate(req.user, routes, action);   // 30s in-process cache; bust on grant writes
      if (v.allowed) return next();
      if (v.unconfigured && !strict) return next();          // observe-mode rollout lives here too
      recordVerdict(req, v);                                 // audited, not just logged
      return res.status(403).json({ error: 'You do not have permission to perform this action.' });
    } catch (err) {
      console.error('[permissionGuard]', err);
      return res.status(503).json({ error: 'Permission check unavailable.' }); // fail CLOSED, never next()
    }
  };
}
// composition on every mutating route: role guard first, then bits
// router.post('/', blockBasicRole, requirePermission(['/assets'], 'create'), ctrl.create);
```

### A.3 Audit on `res.on('finish')` — attributed rows, never blocks the request

```js
function auditLogger(req, res, next) {
  if (!['POST', 'PUT', 'DELETE'].includes(req.method)) return next();
  const snapshot = redactSecrets({ body: req.body, query: req.query, params: req.params }); // BEFORE handlers mutate req.body
  res.on('finish', () => {                                   // req.user exists NOW; it did not at middleware entry
    const user = req.user;
    if (!user && res.statusCode === 404) return;             // scanner noise must not be an unauthenticated write path
    insertAuditRow({
      userId: req.auditUserId ?? user?.user_id ?? null,      // login route sets auditUserId only AFTER the password matches
      ip: normalizeIp(req.ip),                               // '::ffff:10.0.0.5' -> '10.0.0.5'
      route: req.originalUrl.slice(0, 255),
      method: req.method,
      payload: cap(JSON.stringify({ ...snapshot, status: res.statusCode }), 4000),
    }).catch(err => console.error('[audit]', err));          // never delay or fail the request it describes
  });
  next();
}
```

### A.4 Secret redaction — the allow-list wins outright

```js
const NEVER_SECRET = new Set(['changepassword', 'haspasswordexpiration']); // flags ABOUT secrets — must survive,
                                                                           // or the trail hides the very action it records
const EXACT = new Set(['password', 'token', 'pin', 'otp', 'secret', 'authorization', 'signature']);
  // whole-key only: a substring test for 'pin' would redact 'shipping', 'otp' would hit 'adoption'
const STEMS = ['password', 'secret', 'apikey'];              // substring: catches newPassword, confirm_password, PasswordHash

function classify(key) {
  const k = key.toLowerCase().replace(/[-_]/g, '');
  if (NEVER_SECRET.has(k)) return 'keep';                    // checked FIRST, wins outright
  if (EXACT.has(k) || STEMS.some(s => k.includes(s))) return 'redact';
  return 'keep';
}
// walk to MAX_DEPTH 8, preserve shape (keys/nesting/array-ness), replace values with '[REDACTED]',
// Buffers -> `[BUFFER:${len}]`, and NEVER throw — this runs inside res.on('finish') with no request left to fail.
// ONE shared module for the live middleware and any historical scrubber, or the lists drift.
```

### A.5 Parameterized IN-list

```js
function bindIdScope(request, ids, column) {                 // never call with [] — short-circuit before building SQL
  const names = ids.map((id, i) => { request.input(`scope${i}`, sql.Int, id); return `@scope${i}`; });
  return `${column} IN (${names.join(', ')})`;
}
```

### A.6 `GO` batch splitter — run `schema.sql`/migrations through the `mssql` driver

```js
function splitGoBatches(sqlText) {
  // line-anchored so the word "GO" inside comments/strings survives; executes the way sqlcmd/SSMS would
  return sqlText.split(/^\s*GO\s*(?:--[^\n]*)?\s*$/gim).map(b => b.trim()).filter(Boolean);
}
for (const batch of splitGoBatches(fs.readFileSync(file, 'utf8'))) await pool.request().batch(batch);
```

### A.7 Date projection at the service boundary (`useUTC: false` discipline)

```js
// DATE columns come back as JS Date at LOCAL midnight; JSON.stringify -> .toISOString() shifts them a day in any non-UTC zone.
const dateOnly = d => { /* 'YYYY-MM-DD' from LOCAL components; strings: take the pre-'T' prefix; null if invalid */ };
const projectDates = fields => row => {
  for (const f of fields) if (row[f] !== undefined) row[f] = dateOnly(row[f]);
  return row;
};
// every service returning DATE columns, before res.json:
const rows = result.recordset.map(projectDates(['StartDate', 'EndDate']));
// binding the other direction: build a LOCAL-midnight Date from 'YYYY-MM-DD' — never hand the raw string to sql.Date
```

### A.8 Pagination — count and page can never disagree

```js
const where = buildWhereClause(filters);                     // ONE clause string
const bind = r => { /* .input(...) every search/filter param */ return r; };  // ONE bind closure, applied to BOTH
const total = await bind(pool.request()).query(`SELECT COUNT(*) AS n FROM T ${where}`);
const page = await bind(pool.request())
  .input('offset', sql.Int, (pageNum - 1) * pageSize)
  .input('pageSize', sql.Int, pageSize)
  .query(`SELECT * FROM T ${where}
          ORDER BY ${sortMapping[sortBy] || 'T.Id'} ${sortOrder === 'DESC' ? 'DESC' : 'ASC'}
          OFFSET @offset ROWS FETCH NEXT @pageSize ROWS ONLY`); // sortMapping = identifier allow-list; identifiers can't be parameterized
res.json({ items: page.recordset, totalCount: total.recordset[0].n, page: pageNum, pageSize });
```

### A.9 SSE hub — one multiplexed stream

```js
const clients = new Map();                                   // userKey -> res[]
const MAX_PER_USER = 2;                                      // second tab / reconnect racing its predecessor's close
function addClient(key, res) {
  const list = clients.get(key) ?? [];
  list.push(res);
  while (list.length > MAX_PER_USER) { try { list.shift().end(); } catch {} } // evict oldest — orphaned sockets can't accumulate
  clients.set(key, list);
}
function sendTo(key, channel, payload) {
  for (const res of clients.get(key) ?? [])
    try { res.write(`data: ${JSON.stringify({ channel, payload })}\n\n`); } catch {}
}
setInterval(() => {                                          // proxies drop quiet streams; dead sockets surface as write errors
  for (const list of clients.values()) for (const res of list) try { res.write(': ping\n\n'); } catch {}
}, 25_000).unref();                                          // .unref() — the timer must never hold the process open
```

### A.10 Scheduled job — env-gated daily tick, no cron library

```js
let _timer = null, _lastRun = null;
function startAutoSweep() {
  if (_timer) return;                                        // re-entrancy guard
  if (!/^(1|true)$/i.test(process.env.SWEEP_AUTO || '')) return; // opt-in, default OFF
  const hour = parseInt(process.env.SWEEP_HOUR_PH || '2', 10);
  _timer = setInterval(async () => {
    const manila = new Date(Date.now() + 8 * 3600_000);
    const today = manila.toISOString().slice(0, 10);
    if (manila.getUTCHours() !== hour || _lastRun === today) return;
    _lastRun = today;                                        // runs once per day despite 1440 fires
    try { await runSweep(); }                                // per-tenant loops get a NESTED try/catch each
    catch (err) { console.error('[Sweep] tick error:', err.message); } // a scheduler must never crash the process
  }, 60_000);
}
function stopAutoSweep() { if (_timer) { clearInterval(_timer); _timer = null; } }
```

### A.11 Dio interceptors — tenant + auth injection, 401 freeze

```dart
dio.interceptors.add(InterceptorsWrapper(
  onRequest: (options, handler) {
    final companyId = companyIdProvider?.call();              // provider CALLBACKS assigned once at the root —
    final token = tokenProvider?.call();                      // the client never imports Provider or auth code
    if (companyId != null) options.headers['X-Company-ID'] = companyId;
    if (token != null && !options.headers.containsKey('Authorization')) { // per-call override wins
      options.headers['Authorization'] = 'Bearer $token';
    }
    handler.next(options);
  },
  onError: (e, handler) {
    final path = e.requestOptions.path;
    if (e.response?.statusCode == 401 &&
        !path.contains('/auth/login') && !path.contains('/auth/verify')) { // login UI must see the real error
      onUnauthenticated?.call();
      return;   // deliberately neither next() nor resolve(): freeze the Future so widgets the router
                // already disposed can't setState on a dead element
    }
    handler.next(e);
  },
));
```

### A.12 Proxy provider — re-bind, don't rebuild (the `provider` idiom; see §4.2 for the `riverpod` equivalent)

```dart

  create: (_) => XViewModel(),
  update: (_, auth, vm) {

### A.13 Field spec + widget resolver — the schema decides the widget

```dart
// shared/forms/field_spec.dart
enum ColKind { text, memo, integer, decimal, money, date, datetime, flag, fk, fkMulti }

class FieldSpec {
  const FieldSpec({
    required this.name,          // the COLUMN name — the join key the drift linter uses against schema.sql
    required this.label,
    required this.kind,
    this.required = false,       // mirrors NOT NULL. Never hand-decided.
    this.maxLength,              // mirrors NVARCHAR(n). The client must not permit what the column refuses.
    this.scale,                  // mirrors DECIMAL(18,4) -> 4
    this.lookup,                 // lookup route for fk/fkMulti, e.g. 'departments'
    this.dependsOn,              // parent field name for cascading pickers
    this.readOnly = false,       // identity, computed, CreatedBy/UpdatedBy — displayed, never typed
  });
  final String name, label; final ColKind kind; final bool required, readOnly;
  final int? maxLength, scale; final String? lookup, dependsOn;
}

// shared/forms/field_builder.dart — the ONE place a column becomes a widget
Widget buildField(BuildContext ctx, FieldSpec f, FormState state) {
  final validate = Validators.combine([
    if (f.required) Validators.required(f.label),          // "$label is required." — §4.6, never a bare 'Required'
    if (f.maxLength != null) Validators.maxLength(f.label, f.maxLength!),
    if (f.kind == ColKind.integer) Validators.integer(f.label),
    if (f.kind == ColKind.decimal || f.kind == ColKind.money)
      Validators.decimalScale(f.label, f.scale ?? 2),
  ]);
  if (f.readOnly) return ReadOnlyValue(label: f.label, value: state.display(f.name));

  switch (f.kind) {
    case ColKind.date:
      return AppDatePicker(spec: f, validator: validate);  // emits 'yyyy-MM-dd' ONLY — a timestamp here is the §3.10 bug
    case ColKind.datetime:
      return AppDateTimePicker(spec: f, validator: validate);
    case ColKind.flag:
      return AppSwitchField(spec: f);                      // BIT -> two states. A Yes/No dropdown invents a third.
    case ColKind.money:
    case ColKind.decimal:
      return AppNumberField(spec: f, scale: f.scale ?? 2, validator: validate);
                                                           // display rounding MUST match the server's ROUND_HALF_UP (§3.9)
    case ColKind.integer:
      return AppNumberField(spec: f, scale: 0, validator: validate);
    case ColKind.memo:
      return AppTextField(spec: f, maxLines: 5, validator: validate);
    case ColKind.text:
      return AppTextField(spec: f, maxLines: 1, validator: validate);

    case ColKind.fk:
    case ColKind.fkMulti:
      return AsyncLookupPicker(                            // ALWAYS async + paginated — never load-all, even for 11 rows
        route: f.lookup!,                                  // GET /api/lookups/<route>?search=&page= (§3.19)
        multi: f.kind == ColKind.fkMulti,                  // cardinality from the SCHEMA: FK column vs junction table
        parentValue: f.dependsOn == null ? null : state.value(f.dependsOn!),
        onParentChanged: () => state.clear(f.name),        // cascade: child clears when the parent moves
        // the currently-held value is offered even if IsActive = 0, flagged inactive, and is NOT cleared on save —
        // deactivating a lookup row must never rewrite historical records (§4.10)
        retainInactiveValue: state.value(f.name),
        validator: validate,
      );
  }
}
```
