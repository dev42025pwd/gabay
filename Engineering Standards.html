## 11. Appendix B — document templates

### B.1 `<SYSTEM>_PRD.md`

The PRD is the business *why*. It is deliberately short (~100 lines) — the Blueprint is the long document. It contains **no schema, no stack detail, no design**: those live in the Blueprint, and the PRD's §7 merely points at them. Written for the Product Owner and stakeholders as much as for the dev team.

**Authoring rules (all sections):**
- Numbered sections are **stable anchors** — `FEATURE_PIPELINE.md` entries and test manuals cite `PRD §6.3`, so never renumber; append.
- Acceptance criteria must be **testable as written** ("a cashier can void a line item before payment, and the void appears in the audit trail" — not "the system supports voiding"). Each criterion becomes at least one manual test case.
- Business language throughout; a stakeholder who has never seen the code must be able to read every section.

| § | Section | What goes in it |
|---|---|---|
| 1 | **Executive Summary** | One paragraph: what the system is, for whom, and the single-sentence value proposition. If you can't write this yet, the project isn't ready to start. |
| 2 | **Product Vision** | Where the product goes beyond MVP — and, explicitly, **what it will NOT be** (negative space: "this is not an accounting system; it exports to one"). The not-list prevents a year of scope arguments. |
| 3 | **Target Users & Personas** | 3–5 named personas. Each: role, one-line core need, and their working environment (device, connectivity, physical context — a warehouse picker on a rugged scanner with patchy Wi-Fi is a different product than a back-office clerk on a desktop). Every feature in §6 should trace to at least one persona. |
| 4 | **Problem Statement** | The current pain, its cost in concrete terms (hours lost, error rates, money), and why now. This is what the acceptance criteria are ultimately measured against. |
| 5 | **Solution Overview** | How the system answers §4, as a business-level module map (names of modules and what each does for whom — no architecture). One paragraph per module. |
| 6 | **Feature Requirements & Prioritization** | One subsection per feature, `### 6.x <Feature name> (Priority: High/Medium/Low)`, each following the fixed micro-template: **Description** (2–4 sentences) → **Acceptance Criteria** (bulleted, testable, 3–8 per feature) → **Out of scope** (what this feature deliberately excludes, one line). The priority tag drives the pipeline tiers; the criteria drive the E2E manuals. |
| 7 | **Technical Requirements & Constraints** | Constraints only, not design: deployment posture (on-prem / cloud / LAN-only / offline-capable), the mandated stack (one line, pointing at Blueprint Part 1), compliance jurisdiction (name the actual regulator and regulation — for PH retail/POS: BIR CAS/POS accreditation, e-receipt/e-invoice rules, price-tag law; for warehousing: inventory valuation method, customs bonded-warehouse rules if applicable), and scale expectations as numbers (concurrent users, records/year, peak transactions/hour). |
| 8 | **Dependencies & Integration Points** | External systems (ERP, payment terminals, barcode hardware, courier APIs) AND the **human/vendor dependencies** — "branch managers must supply clean opening-stock CSVs", "scanner hardware procurement lead time is 6 weeks". The human ones are the ones that slip schedules; naming them here makes them the PO's problem on day one, not the dev team's problem in week ten. |
| 9 | **Release Plan & Timeline** | A milestone table (`Milestone | Phase | Key deliverables`) that **mirrors Blueprint Part 5 row-for-row** — two views of one plan, never two plans. |

### B.2 `<SYSTEM>_MASTER_BLUEPRINT.md`

The Blueprint is the engineering **source of truth**: the document every developer — and every AI agent, via the `CLAUDE.md` required-reading rule — must read before touching schema, architecture, or domain logic. Its length follows the system's complexity — a substantial system's runs to a hundred pages or more — and it earns that length by being the *only* place these decisions live. It is on the companion-file sync table: any change to an architectural decision, module boundary, or domain rule updates it **in the same change**.

**Preamble** (before Part 1):
- A declaration line: *"You are reading the Master Architecture Document. You must strictly adhere to the constraints, tech stack, and logic defined in this file for all subsequent code generation, architecture decisions, and database queries."* This is what makes AI-agent required-reading enforceable rather than decorative.
- An **Integration Summary**: a running change-log of architectural pivots ("2026-03: single-tenant → multi-tenant, because …", "PRD §7 conflicted with Part 2 on offline mode; resolved in favor of …"). It answers *"why is it shaped like this"* so decisions don't get re-litigated by people who weren't there.

| Part | Title | What goes in it |
|---|---|---|
| 1 | **System Directives & Constraints** | Machine-readable tagged blocks (pseudo-XML fences an agent can be pointed at): `<system_directive>` (role/domain assignment), `<tech_stack_constraints>` with an explicit **allow list AND deny list** ("Do NOT suggest React, Python, PostgreSQL, ORMs") **and the project's pinned versions** — runtime, framework, and each top-level dependency's major, with the date chosen and the published end-of-support date where one exists. The company standard (§1) names the choice and the currency policy; this is the only place the actual number lives, and the lockfiles enforce it, `<routing_and_auth_constraints>` (URL-shaped CRUD, guard order, session rules), `<compliance_context>` (the domain's regulatory rules, with year — swap per system: payroll statutes for HR, BIR POS accreditation for retail, valuation rules for WMS), and a **cross-cutting invariants & known traps** block — the date/timezone rule, money-math rule, tenancy predicate rule, feature-flag registry: every trap that, if unknown, a competent developer would still fall into. |
| 2 | **Architectural Blueprint** | 2.1 Tenancy model (single vs multi, and the org dimensions — company/branch/site — with which are hierarchical); 2.2 system diagram + realtime transport choice; 2.3 canonical folder structures for backend and frontend (the shapes from §3–§4 of this checklist, made project-specific); 2.4 the security layer as an ordered middleware chain; 2.5 external integrations layer; 2.6 supported deployment topologies (single VM, Docker, multi-client), each with its known limits. |
| 3 | **DB Schema Architecture** | Table-by-table: columns with type, PK/FK, nullability, and per-column annotations for **encrypted-at-rest** and **audit-stamped** fields; naming conventions; the standard audit columns (`CreatedBy`/`UpdatedBy` + temporal/history policy) stated once and inherited by every table; and — critically — **deliberate exclusions with rationale** ("no soft-delete on X because …", "table Y is deliberately not temporal because …"). An exclusion that isn't written down gets "fixed" by the next developer. Also: **indexes per table, each annotated with the query it serves** — with raw parameterized SQL and mandated `OFFSET/FETCH` pagination this is the only place index intent is recorded; and a **retention/growth policy for every high-volume table**, the audit table above all, which accrues a ~4 KB row per POST/PUT/DELETE forever unless someone decides otherwise here. |
| 4 | **Core Modules & Integration Mapping** | One numbered subsection per functional engine (for a POS: pricing engine, stock-movement engine, settlement/EOD engine, returns engine…). Each subsection: purpose, the key rules/algorithms in prose precise enough to test against, inputs/outputs and events emitted, the permission routes it owns, and — the doc↔code link — **the name of the implementing service file** (`pricingEngine.service.js`). When the file is named here, "where does this rule live" has one answer. |
| 5 | **MVP Development & Release Roadmap** | The milestone table mirroring PRD §9. Milestone, phase, key activities & deliverables. Updated when the plan changes, in the same commit as the pipeline update. |
| 6 | **Feature Development Guidelines** | Numbered **named rules** — a rule with a name gets cited in code review; an anonymous one gets forgotten. Format per rule: the name ("the Refresh Trap", "the Registry Rule", "the server decides, the client renders"), the rule in one or two sentences, **the failure it prevents — incident-first with date and symptom when a real incident exists**, the exact file(s) to edit when following it, and its enforcer (script/hook/CI job) or an honest "code-review item". **Every rule declares which kind of control it is** — a *skill* (advisory: makes the agent likely to comply), a *hook* or *lint* (deterministic: makes non-compliance impossible), a *`REVIEW.md` pass*, or *human-only*. A rule that must always hold needs something deterministic behind it; the skill makes violations rare and the hook makes them close to impossible (§14). Part 6 is where this checklist's per-project equivalents accumulate over the system's life. |

**Maintenance rules:**
- Stable `§` anchors — other docs cite `Blueprint §4.2`; append, never renumber.
- Every rule added to Part 6 follows the incident-first + named-enforcer conventions from §2 of this checklist.
- When Part 1 and the PRD conflict, resolve explicitly and record the resolution in the Integration Summary — never leave two documents disagreeing silently.
- Where the Blueprint and this company checklist conflict, the checklist wins on cross-cutting rules (security, money, dates, tenancy, reference data) and the Blueprint wins on domain and module decisions. Record every such resolution in the Integration Summary.

### B.3 `FEATURE_PIPELINE.md`

The pipeline is the **status ledger**: the one place that answers "what is the state of X" and "what is next". The PRD says *why* a feature exists (B.1 §6), the Blueprint says *how* it is built (B.2 Part 4), and the pipeline says *where it is*. Three documents, one feature, no overlap — if a fact appears in two of them, delete one copy.

It is the most-read and most-rotted document in the set. Every rule below exists to slow the rot.

**Authoring rules (all sections):**
- **IDs are permanent.** `P0-01` is allocated once, at filing time, and never changes — not when the feature is re-tiered, not when it ships, not when it is cancelled. The prefix records where it was *filed*, not where it is now; the current tier lives in the entry's `Tier` attribute. This is a known trap: the ID looks like it encodes the tier, and the first person to "fix" a promoted P2 by renumbering it to `P0-14` breaks every test-manual and commit-message reference to `P2-07`.
- **Insertion is by letter suffix**, the same rule as the test manuals (§7.3): a feature that must sit between `P0-03` and `P0-04` becomes `P0-03A`. Nothing renumbers, ever.
- **Append-only.** Shipped entries move to §6 with their ID intact; they are not deleted, because the record of "when did we decide to build this, and why that tier" is the whole point.
- **No dates, no percentages, no estimates-as-commitments** in entries. Effort is a T-shirt size (S/M/L); `Status` comes from the legend; anything finer-grained belongs in the tracker, not here. (Negative space, stated so nobody adds a `% complete` column in month three.)
- Every entry cites `PRD §6.x` and `Blueprint §4.x`. An entry with no PRD reference is a feature nobody asked for; an entry with no Blueprint reference is a feature nobody designed.

| § | Section | What goes in it |
|---|---|---|
| 1 | **How to Use & Conventions** | The ID scheme and the two rules above (permanence, letter-suffix insertion); who may add an entry and who may change its tier; the statement that this file is on the companion-file sync table (§8.5) and moves in the same commit as the code. Also the **generated totals** callout: per-tier counts are produced by a script, never typed (§2 doc conventions). |
| 2 | **Status Legend & Tier Definitions** | The closed status set with its transitions — recommend `PLANNED → IN PROGRESS → DONE`, plus `BLOCKED` and `CANCELLED (reason)`. Small and closed: a legend left open drifts into a dozen ad-hoc status strings, and the CI grep for DONE markers (§8.3) stops matching. Then the tier definitions in one line each: **P0** = the system is not usable without it; **P1** = not releasable without it; **P2** = not sellable without it; **P3** = wanted, unscheduled. State the mapping from the PRD's priority tags explicitly (`High → P0/P1`, `Medium → P2`, `Low → P3`) so the two documents cannot disagree about the same feature. |
| 3 | **The Ledger — one subsection per tier** (`3.1 P0`, `3.2 P1`, `3.3 P2`, `3.4 P3`) | One `#### <ID> — <Feature name>` per entry, each followed by **the fixed attribute table, same rows in the same order, every time** — a scannable ledger is worth more than a well-phrased one: `Description` (one or two sentences), `Why this tier` (the argument, not a restatement of the tier), `Tier` (current, if it differs from the ID prefix), `PRD / Blueprint` refs, `DB` (tables and migrations touched), `Backend` (routes and services), `Frontend` (screens and routes), `Effort` (S/M/L), `Dependencies` (other IDs — and *why*, since "depends on P0-02" without a reason gets ignored the first time it is inconvenient), `Status`, and the four artifact-chain rows — `Intent`, `Spec`, `Plan`, `PR` (§14). Those four make this file the **index** of the per-change chain rather than a second backlog living alongside it; without them the two layers drift apart within a month. Sub-tasks, if a feature needs them, are a nested checklist inside the entry — never separate entries, or the dependency graph doubles. |
| 4 | **Dependency & Ordering Map** | The build order as a flat ordered list or a small Mermaid graph, derived from the `Dependencies` rows. This is the section that catches the cycle and the orphan; the per-entry rows alone never do. Also the home for **cross-cutting prerequisites**: the §5 baseline-platform items that must exist before a domain feature can land on rails. |
| 5 | **Per-Feature Definition of Done** | The checklist from §9 of the standard, adapted to this project's actual file names and commands. Copied here — not linked — because a developer closing out a feature reads this file, not the company standard. Each item names the file it touches. An entry may only be marked `DONE` when every line is ticked or explicitly waived in one line, per the sync-table governing rule (§8.5). |
| 6 | **Completed Archive** | Shipped entries, newest first, with their original IDs, the release version they shipped in, and a one-line "what actually changed from the plan". That last field is the cheapest institutional memory in the whole document set. |

**Enforcers:**
- CI lint (§8.3, fast always-on): entries whose `Status` is not in the legend; entries with no `PRD`/`Blueprint` reference; `Dependencies` naming an ID that does not exist; `DONE` entries still sitting in §3 rather than §6; duplicate IDs.
- Generated per-tier totals — a script, wired into the same lint.
- Everything else here is a **code-review item**, honestly: no linter can tell you the tier argument is wrong.

## 12. Known gaps to close (mandatory in new projects)

Patterns this standard describes but that existing codebases commonly lack. New projects do not inherit the gap.

1. **Schema validation middleware** (zod/joi) — rather than hand-written guard clauses per handler.
2. **ESLint + Prettier + customized `analysis_options.yaml`**, configured so a violation can actually fail the build.
3. **Structured logger** (pino) with the bracketed-subsystem-tag convention kept; never `console.log` whole SQL or request bodies.
4. **Standardized error body** — one `{error}` shape everywhere.
5. **HMAC over raw bytes** for webhooks (`express.json({verify})`).
6. **Zero-padded migration numbers.**
7. **Injectable ApiClient seam** in frontend services for tests.
8. **Real README** carrying the hooks-enable step.
9. **Tenant-scope lint** — grep tenant tables queried without `CompanyID = @companyId`.
10. **Configurable lockout threshold** — not a magic `3` in the controller.
11. **Generated test-case totals** in manuals; smoke guide revised in place, never forked.
12. **Enforcer migration** — every rule in this document whose enforcer is a script becomes a hook or a lint in the verification command; every rule whose enforcer reads "code-review item" becomes a `REVIEW.md` pass. A rule enforced only by a person reading this file is a rule that will not survive the first week of parallel sessions (§14).

---

## 13. Standard changelog & governance

This document mandates that other documents carry a version, a date, and a changelog (§2, §4.8). It is subject to its own rule. Newest first; entries are plain-language and say what a reader must do differently.

| Version | Date | Change | Action for existing projects |
|---|---|---|---|
| 1.0 | 2026-09-20 | Initial release. | — |

**Governance of this document:**

- [x] **Owner: Allan Young. Deputy: Raphael Mendoza.** An unowned living document is a dead document. The deputy exists so a blocked sign-off is never answered with "ask again next week" — teams that wait do not wait; they proceed and document nothing, and the exception becomes permanent by silence.

  **What the owner decides:** proposed rule changes (the RFC path below); stack deviations and their `EXCEPTIONS.md` entries, including expiry dates; the quarterly review and its record; and whether an audit's section H finding becomes a rule or is declined. **Under §14 the role also approves skill, hook, and `REVIEW.md` changes**, which reach every repo at once — that is the weightiest thing on this list, and it is why those changes are gated on the eval suite (§7.2) rather than on judgement alone.

  Either name may sign. Where a deviation is sought for a project the owner is themselves working on, the deputy signs it — an owner approving their own convenient exception is the failure this pairing is for.
- [ ] **Review cadence**: quarterly, plus mandatorily at the end of the first project audited against it. Record the review in the table above even when nothing changes — "reviewed, no change" is information.
- [ ] **Two speeds, one standard.** Skill, hook, and `REVIEW.md` changes ship **continuously**, gated on the eval suite (§7.2) and signed off by the rule's policy owner. The quarterly review then audits *what the loop already changed* — plus the version-floor sweep and the `EXCEPTIONS.md` expiry sweep. The quarterly meeting stops being where change happens and becomes where change is checked; a governance cadence slower than the delivery cadence gets routed around rather than followed.
- [ ] **Proposing a change**: a one-page rationale naming the incident or the project that exposed the gap, plus the enforcer the new rule will get. No incident and no enforcer means it is a preference, and preferences do not go in a standard.
- [ ] **Deviations**: an approved exception lives in the project's `EXCEPTIONS.md` — rule, reason, approver, and an **expiry date**. Exceptions without expiry dates become the standard by silence.
- [ ] **No version numbers in this document.** §1 names choices and a currency policy; actual versions live in each project's Blueprint Part 1 and its lockfiles. The quarterly review therefore asks only *is the policy still right*, not *are these numbers still current* — a question whose answer rarely changes, which is the point. Version currency is enforced per project by the end-of-support check (§1, §14.3), never by someone remembering to sweep this file.
- [ ] **Feed-back loop**: every audit's section H ("rules this repo needed that the checklist lacks") is triaged into this changelog or explicitly declined. This document was distilled from one system; it stays honest only if projects #2 and #3 are allowed to amend it.

---

## 14. AI-native SDLC

When agents write most of the diff, the constraint moves to the human-speed stages either side of the build, and a control enforced by someone reading this document stops matching reality. This section says how the rules above are enforced once that is true. It changes no rule; it changes where each rule lives.

### 14.1 Two granularities

| | Scope | Lifetime | Artifacts |
|---|---|---|---|
| **Standing** | The system | Years | PRD, Master Blueprint, `FEATURE_PIPELINE.md`, `schema.sql`, E2E manuals |
| **Per change** | One change | Days, then archived | `intent.md` → `spec.md` → `plan.md` → diff + tests → PR + findings |

Standing artifacts are constraints. Change artifacts are transactions against them. The PRD stops being the per-change alignment ritual and becomes the standing statement of what the product is and is not; per-change alignment happens in `intent.md`, and an accepted intent **appends** to PRD §6 rather than triggering a rewrite.

- [ ] [P0] **The repo is the source of truth.** Markdown artifacts are authoritative; any tracker holds a link and the commit SHA. Declared once, per artifact, so nobody has to guess which copy is real.
- [ ] [P0] **The pipeline ID is the join key.** `intent/<id>-<slug>.md`, `spec/<id>.md`, `plan/<id>.md`, and the four artifact rows on the pipeline entry (Appendix B.3). One backlog, not two.
- [ ] [P0] Every `intent.md` carries **profile deltas** (does this touch money, tenancy, dates, or reference data — these route the spec pass to the right skills) and a **PRD trace** (`PRD §6.x`, or `NEW`, which is the signal that a human product decision is owed *before* design rather than after).
- [ ] [P1] The design pass **flags rather than decides** five categories: a new table or column, a change to a Blueprint Part 6 named rule, anything touching the Part 1 compliance context, a new external integration, and any §1 stack deviation. Wrong autonomous decisions in these five are expensive and slow to detect.
- [ ] [P1] `plan.md` names the §9 items the change triggers and the Part 6 rules that apply — both mechanical from the profile deltas, and both give the review something concrete to check the diff against.

### 14.2 Where each rule lives

This document already carries an enforcer on nearly every rule. That column is the migration plan.

| Enforcer in this document | Becomes |
|---|---|
| Script / linter | A **hook** that runs on the matching action, plus the verification command |
| CI job | Unchanged, plus a `REVIEW.md` exclusion so it is not reported twice |
| "Code-review item" | A **`REVIEW.md`** pass |
| Prose rule with no enforcer | A **skill**, which is advisory — and if the rule must always hold, a hook behind it |

- [ ] [P0] **Skills carry the sections; `CLAUDE.md` points.** This document is too long to be read every session. Decompose it into triggered skills — data access (§3.7, §3.9, §3.11, §3.19), money and dates (§3.9, §3.10), tenancy and authorization (§3.4, §3.5), audit and actor (§3.6, §3.18), schema-derived forms (§4.10, Appendix A.13), frontend surface (§4.6, §4.7), migration and process (§8), document authoring (Appendix B), definition of done (§9). The same decomposition solves the Blueprint problem: a 120-page required-reading document cannot live in `CLAUDE.md`, but Part 3 can arrive the moment someone touches schema.
- [ ] [P0] **A skill is advisory; a hook is deterministic.** Do not put a rule that must never be broken behind a skill alone. Build-time hooks worth having on day one: block edits to a committed migration; require teardown alongside a `CREATE TABLE`; run the drift linter after any frontend file edit; keep secrets out of the diff; block writes to a derived balance column outside its owning engine.
- [ ] [P1] Distribute company-wide skills as **one versioned plugin**, so a policy change ships once. This is also the risk: one edit changes every repo at once. **Do not install the plugin before `evals/` exists** (§7.2) — the eval gate is the only control that catches a skill edit that quietly degrades the standard everywhere.
- [ ] [P1] `REVIEW.md` runs four passes: **bugs**; **security** (§3, §6); **standard compliance** (only the rules whose enforcer reads code-review item — never what CI already catches); and **artifact compliance** (does the diff match `plan.md`, did the pipeline entry move, was the sync table walked, was `schema.sql` updated with teardown).
- [ ] [P1] **The agent acts up to the production gate and not past it.** Branch protection means everything the agent produces arrives as a PR; the agent that wrote the code has no route to approve it. Production deploy requires a named release authorization, expressed as a hook in managed settings.

### 14.3 Closing the loop

- [ ] [P2] Detection is **deterministic** — version-controlled bands with no model in the detection path; the model is invoked once a band is breached, and the tier sets what it may do. First metrics worth banding for a system built to this standard: post-deploy 5xx rate, audit-table daily row growth (the early warning on §3.6's retention policy), drift-linter failure rate, and idempotency-key collision rate, which rises when clients are retrying and something upstream is broken.
- [ ] [P2] Findings from a breach, a scheduled security scan, or an on-call channel all produce **one output format**: an `intent.md` in the §14.1 shape. A finding that fits one PR goes through the review gate; anything wider starts at plan.
- [ ] [P2] The compliance audit (`PROJECT_STANDARDS_AUDIT_PROMPT.md`) runs **on a schedule, non-interactively**, rather than being pasted in by hand. Its section H is triaged into §13.
- [ ] [P1] **The incident loop this document already mandates, now automated:** incident → postmortem → a named rule in Blueprint Part 6 → a skill or hook if the rule has an enforcer → an **eval** that keeps it enforced. Part 6's incident-first convention is already the right input format; the only new step is the eval.

### 14.4 What to measure

Two numbers say whether this is working. **Audit findings per quarter split into "a rule existed and was violated" versus "no rule existed"** — the first should fall as hooks and skills land, and the second is the honest measure of whether a standard distilled from one system is learning from the others. And **how often the merged diff still matches the committed `plan.md`**, which is the cheapest available signal that the plan-then-build discipline is real rather than ceremonial.

> **Version**: 1.0 | **Date**: 2026-09-20 | **Status**: Living document

## 1. One loop, not many

**There is one loop.** Plan → Design → Build → Test → Deploy → Maintain, and Maintain writes the next Plan.

It runs at **three amplitudes** — the same six stages, at different scales:

| Amplitude | Turns | What the turn produces |
|---|---|---|
| **Founding** | Once, at the start | The PRD, the Blueprint, the pipeline, the build order |
| **Feature** | Many, one per change | One `intent → spec → plan → diff → PR` chain |
| **Autonomous** | Continuously, self-triggered | The same chain, started by a machine rather than a person |

A founding turn and a feature turn are the same six stages. The founding turn's `intent.md` is *"we should build a POS"*; its `spec.md` is the PRD and Blueprint Parts 1–3; its `plan.md` is the pipeline plus the build order. Not a different process, only a bigger one.

**Two things sit outside the loop:**

- **Bootstrap** comes before it. The loop cannot run until a repo, `CLAUDE.md`, a verification command, and branch protection exist. You cannot run the loop to create the preconditions of the loop. It is a cold start, and it happens once.
- **Decommission** comes after it. No turn of the loop switches a system off. It gets a section here precisely because a process designed to run forever has no natural home for it.

```mermaid
flowchart LR
  B[Bootstrap<br/>once, outside the loop] --> P
  P[Plan] --> D[Design] --> BU[Build] --> T[Test] --> DE[Deploy] --> M[Maintain]
  M -->|writes the next intent| P
  M --> X[Decommission<br/>once, outside the loop]
```

## 2. Which document answers which question

Orthogonal to the loop, and unchanged. Six documents, six questions. If two answer the same one, delete a copy.

| Question | Document |
|---|---|
| Why does this system exist? Why this change? | **PRD** (system) / **`intent.md`** (change) |
| How is it built? What are the rules? | **Master Blueprint** |
| What is the state of X? What is next? | **`FEATURE_PIPELINE.md`** |
| Is this change actually done? | **§9 definition of done**, each item with its enforcer |
| Does it still work? | **E2E manuals + smoke guide + the verification command** |
| How do we ship it? | **Deployment runbook + per-release deploy plan** |
| Do we still comply? | **Audit report** |

---

## 3. Bootstrap — the cold start

Once per repo, before the first turn. Nothing here is a stage; it is the wiring the stages assume.

- A repository, with branch protection so nothing reaches main without review.
- `CLAUDE.md`, under a page, with the verification block.
- One verification command that runs everything and exits non-zero.
- Two or three build-time hooks; the committed-migration guard first.
- `REVIEW.md` with its four passes.
- The intent, spec, and plan directories, and the pipeline file.

**Gate:** a deliberately bad change is blocked by a hook or by the verification command, on a repo with no features in it.

Not in bootstrap: the skills plugin and the eval suite. Those land during the founding turn's Test stage, and the plugin never ships before `evals/` exists (§14.2).

---

## 4. The same six stages, at three amplitudes

Read a row to see one stage; read a column to see one kind of turn.

| Stage | **Founding turn** (once) | **Feature turn** (per change) | **Autonomous turn** (self-triggered) |
|---|---|---|---|
| **Plan** | The founding intent: what the system is, for whom, and what value it delivers. If you cannot write it in a paragraph, the project is not ready to start. | `intent/<id>-<slug>.md` in the originator's words, with profile deltas and a PRD trace. | A control-band breach, a scheduled scan finding, or an on-call mention writes `intent.md` in the same shape. No person in the invocation path. |
| **Design** | The **PRD** (all 9 sections) and **Blueprint Parts 1–3**. The schema is the output that matters, and it is the gate. | `spec/<id>.md`, constrained by the PRD, the Blueprint, and the skills carrying the standard. Five categories are flagged, not decided. | Same, unattended, with a confidence gate deciding whether it continues or escalates to a person. |
| **Build** | **Blueprint Parts 4–6** and the **pipeline**, which together are `plan.md` at system scale: what gets built, in what order, against which dependencies. | `plan/<id>.md` in plan mode, then the diff. The plan names the §9 items and the Part 6 rules the change triggers. | Same, with the tier in `bands.yaml` setting what the agent may do — diagnose only, or open a PR. |
| **Test** | Build the verification command itself, the structural linters, the E2E skeletons, and the eval suite. | The verification command runs before a human looks; the verifier subagent re-checks in a fresh context. | Same. The incident that started the turn becomes a permanent eval. |
| **Deploy** | Establish the gates: branch protection, the production-authorization hook, the runbook, the rollback path — and prove the restore drill. | The PR, four review passes, human code-owner approval. | The PR still needs a human. The agent acts up to the production gate and not past it. |
| **Maintain** | Write `bands.yaml`; decide the retention policies; start the audit cadence. | Incident → a **named rule in Blueprint Part 6** → a skill or hook → an eval that keeps it enforced. | Detection fires, and the next Plan begins. The loop is closed. |

**A note on phases.** "Rails" and "features" are not stages — they are *many feature turns*, differing only in whether the subject was the platform or the domain. What governs their order is **Appendix C**, which is a rule about the sequence of turns (enforcers before the code they govern, rails before the traffic), not a parallel stage model. Appendix C's phase numbers are unchanged and are still cited by the PRD and Blueprint milestone tables.

## 5. Decommission — outside the loop

The part nobody plans for, which is why it is written down.

**Change of shape** — single-tenant becomes multi-tenant, a new jurisdiction, a new deployment topology — is *not* decommission. It is a founding-amplitude turn: a large intent that amends the PRD and the Blueprint and adds a row to the Integration Summary. It runs through the same six stages at the larger scale.

**Actual decommission**, or a tenant leaving, needs four things that must exist long before they are used, because under time pressure they are decided badly:

- A per-tenant data export.
- The retention and purge policy from Blueprint Part 3.
- A written answer to *what happens to the audit trail*.
- Who authorizes the switch-off, and what evidence they need.

If those were not settled during the founding turn's Design stage, they get settled by whoever is on call.

---

## 6. Artifact matrix

| Artifact | First exists | Owner | Updated | Read by |
|---|---|---|---|---|
| `CLAUDE.md`, `REVIEW.md`, hooks | Bootstrap | Tech lead | On repeated agent mistakes; on policy change | Every session |
| `<SYSTEM>_PRD.md` | Founding Design | Product Owner | Appended by accepted intents | Everyone; stakeholders |
| `<SYSTEM>_MASTER_BLUEPRINT.md` | Founding Design (1–3), founding Build (4–6) | Tech lead | Same commit as any architectural change | Every dev, every agent |
| `FEATURE_PIPELINE.md` | Founding Build | Tech lead + devs | Every turn, at both ends | Everyone, daily |
| `intent/`, `spec/`, `plan/` | First feature turn | Originator → PO → engineer | Per turn; archived, not deleted | The next stage |
| `schema.sql` + migrations | Founding Design | Tech lead | Migration-first, every change | Devs; the drift linter |
| E2E manuals, smoke guide | Founding Test | QA + devs | Per turn | QA |
| Runbook, deploy plan | Founding Deploy | Tech lead | On infra change | Deployer, on-call |
| `bands.yaml`, `evals/` | Founding Maintain / Test | Platform owner | On each incident | CI |
| `EXCEPTIONS.md` | First approved deviation | Tech lead | On grant and on expiry | Auditor |
| `INCIDENTS.md` | First incident | On-call | Per incident | Everyone |
| Audit report | Founding Deploy, then scheduled | Auditor | Per run, diffed | Lead, management |

---

## 7. Where the standard's sections land

| Stage | Checklist sections in play |
|---|---|
| Bootstrap | §8, §14.2 |
| Plan | Appendix B.1, §14.1 |
| Design | §1, §2, §3.9–§3.10 (schema shape), Appendix B.2 Parts 1–3 |
| Build | §3, §4, §5, §12, Appendix A, Appendix B.2 Parts 4–6, Appendix B.3 |
| Test | §7, §9, §14.2 |
| Deploy | §6, §7.4, §8, §14.2 |
| Maintain | §13, §14.3, audit sections H and I |
| Order of turns | Appendix C |

---

## 8. The three feedback edges

1. **Within a turn**: `plan.md` → diff → review checks the diff against the plan. Broken when the plan is written and never referenced again, which review pass 4 exists to catch.
2. **Turn to standing artifact**: an incident or a trap becomes a **named rule in Blueprint Part 6**, then a skill or hook, then an eval. Broken when fixes ship without a rule, and the same class recurs in a different module.
3. **Project to company standard**: the audit's section H → checklist §13. Broken by default, because nothing forces it — which is why section H is mandatory and must say "nothing" rather than be omitted. This standard was distilled from one system; this edge is the only reason it will ever describe more than one.

<script type="text/plain" id="src-order"># Appendix C — Order of turns

> **Version**: 1.0 | **Date**: 2026-09-20 | **Status**: Living document
>
> **What this is, and is not.** The loop is Plan → Design → Build → Test → Deploy → Maintain (`PRODUCT_LIFECYCLE.md`). This appendix is **not a second stage model**; it is the rule governing *the order in which turns of that loop are taken* — which subject you build first, and which one has to wait. The phase numbers below are cited by PRD §9 and Blueprint Part 5 milestone tables and are unchanged.

> **Drop-in target**: append to `NEW_PROJECT_STANDARDS_CHECKLIST.md` after §14, as **Appendix C**. Cite as `Appendix C.1`, `Appendix C.2`.

---

## The one ordering principle

**Enforcers before the code they govern; rails before the traffic.**

Every phase below exists because the work in it is *cheap now and expensive later*. Middleware order, the error shape, date projection, actor context, and the tenant predicate are architectural: retrofitting any of them touches every route that exists at the time. The `FieldSpec` resolver and the drift linter are the same shape one layer up: build them before feature #1 and you build them once; build them during feature #3 and you refactor features #1 and #2 to match.

**Phases end on conditions, not dates.** Each gate below is checkable by a person who did not do the work. This mirrors the pipeline's own rule against dates and percentages (Appendix B.3) — a phase is done when its gate passes, and a phase whose gate does not pass is not "90% done", it is not done.

**Phases are not teams, and they are not stages.** One person can run all of C.1; the sequence is about ordering, not headcount. Each phase is a run of *several turns of the one loop*, differing only in the subject being built — the platform in phases 1–3, the domain in phase 4.

**Where the AI-native plays land** (§14). `CLAUDE.md`, the verification command, build-time hooks and `REVIEW.md` fold into **phase 1** — they are guardrails, and guardrails come before the traffic. The skills plugin and its eval suite fold into **phase 3**, alongside the other machinery every later feature consumes. The `intent.md` → `spec.md` → `plan.md` chain and the approval gates must be running **before phase 4's first feature**, because that is the first pass through the loop. Closing the loop — bands, scheduled audit, scheduled scan, on-call — lands in **phase 6**. In C.2 the same four first plays are R2, which is where they already sat and for the same reason.

---

## C.1 — New project (greenfield)

| Phase | Name | Ends when |
|---|---|---|
| 0 | Decide & document | Schema reviewed; stack deviations signed off |
| 1 | Rails & guardrails | Linters and hooks block a bad commit on an app with zero features |
| 2 | Identity, access, tenancy, audit | §6 security gate passes on a system with no domain features |
| 3 | Reference data & form machinery | §5 baseline complete; drift linter green |
| 4 | Domain features (P0) | Every P0 pipeline entry `DONE` with §9 fully ticked |
| 5 | Release gate | Audit report with zero Critical and zero High |
| 6 | Cadence | Never — this one recurs |

### Phase 0 — Decide & document

**In:** the project profile (the six axes from the audit prompt's Step 1: tenancy, write contention, money handling, audience, connectivity, instance count). PRD §1–§7 (Appendix B.1). Blueprint Parts 1–3 (Appendix B.2) — constraints, architecture, **schema**. `FEATURE_PIPELINE.md` §1–§3 with the P0 tier populated (Appendix B.3). Stack confirmed against §1.

**Not in:** any code. Any feature below P0. Blueprint Parts 4–6, which need the schema settled first.

**Why first:** the profile decides which sections are genuinely N/A for the whole life of the project, and §1 deviations color everything downstream — an off-stack decision found in phase 4 is a rewrite, found in phase 0 it is a conversation. The schema is the gate because §4.10 makes every form a projection of it; a schema that changes in phase 3 changes forms that do not exist yet, which is free.

**Gate:** `schema.sql` exists and has been read by someone other than its author. Every §1 deviation is either reversed or has written lead sign-off with an expiry date in `EXCEPTIONS.md`.

### Phase 1 — Rails & guardrails

**In, backend:** §3.1 bootstrap and middleware order. §3.16 config/env/`.env.example`. §3.8 error shape. §3.9 DB layer plus the `GO` splitter (A.6). §3.10 date projection (A.7). §3.11 pagination envelope (A.8). §3.18 actor context (A.1).

**In, frontend:** §4.1 structure. §4.3 networking with the Dio interceptors (A.11). §4.7 theming tokens. §4.2 state management with the proxy-provider pattern (A.12). The `shared/` skeleton from §4.6 — the components can be stubs, the *directory and the rule* cannot.

**In, process:** §8.1 git hooks (and the README line that enables them). §8.2 migration discipline. §8.3 CI's three workflows. §8.4 `CLAUDE.md`. §8.5 the companion-file sync table. §7.2 structural linters, **including the schema↔form drift linter** — it must exist before the first form, or it is a retrofit that fails on day one against fifty pre-existing violations and gets disabled.

**Not in:** authentication. Any table that is not in the phase-0 schema. Realtime, notifications, jobs, uploads, webhooks.

**Gate:** a deliberately bad commit (a hardcoded colour, an unparameterized query, a `TextFormField` in a view) is blocked by the hooks or CI on an application with zero features.

### Phase 2 — Identity, access, tenancy, audit

**In:** §3.3 authentication. §3.4 three-layer authorization (A.2). §3.5 multi-tenancy, if the profile says so. §3.6 audit trail (A.3). §3.2 rate limiting, both kinds. §3.7 input validation. A.4 secret redaction. §4.4 client auth and session. §4.5 routing and guards. From §5: user, role, and permission maintenance plus the menu.

**Not in:** domain tables. Reference tables (phase 3). Anything the profile marked N/A.

**Why here and not later:** the tenant predicate and the actor context must be in place before the first domain table exists, or every one of those tables is one migration away from being wrong. The audit trail must precede the first mutation, or you own a window of unauditable writes that can never be reconstructed — that is the one defect in this document that cannot be fixed after the fact.

**Gate:** the §6 security release gate passes in full, on a system that does nothing yet. Passing it here costs an afternoon; passing it for the first time in phase 5 costs a sprint, which is why teams skip it.

### Phase 3 — Reference data & form machinery

**In:** §3.19 in full — the `/api/lookups/:name` controller, the allow-list map, tenant scoping, the pagination cap. §4.10 in full — `FieldSpec`, the resolver (A.13), the async picker with its inactive-value retention, cascading pickers, derived validators. §4.6's real shared components: list scaffold, filter config, form rows, the confirm and messaging surfaces. The generic lookup-maintenance screen. The first two or three actual reference tables, both seeds, permission routes, menu entries. The drift linter wired into pre-commit.

**Not in:** domain features. A lookup table that no phase-4 feature needs yet.

**Why here:** this is the phase whose position earns the most. Every feature after it consumes these components. A team that starts feature #1 before the picker exists ships three pickers and then unifies them, badly, in month four — and the unification is invisible to the customer, so it never gets scheduled.

**Gate:** §5 baseline platform features all ticked. The drift linter is green and has caught at least one real mismatch (if it never fires, verify it actually runs — a linter that has never failed is usually a linter that is not wired up).

### Phase 4 — Domain features, P0 tier

**In:** the pipeline drives, one entry at a time, in the order the dependency map gives. The §9 definition of done — all fifteen items — applies from the **first** feature, not from the third. §7.1 e2e coverage and §7.3 manuals grow with each entry.

Turn on §3.12 realtime, §3.13 notifications, §3.14 scheduled jobs, §3.15 uploads, and §3.17 webhooks **at first need, not speculatively** — but when a feature needs one, build it to the whole section, not to the feature's slice of it. Half an SSE hub is worse than none, because the second feature will add a second EventSource rather than finish the first hub.

**Not in:** P1 and below. "While we're in here" refactors that are not on a pipeline entry.

**Gate:** every P0 entry is `DONE` with §9 fully ticked or explicitly waived in one line, and every entry has moved to pipeline §6 with its ID intact.

### Phase 5 — Release gate

**In:** §6 in full, again. §7.4 smoke tests and the per-release guide. §4.8 in-app versioning and changelog. The deployment runbook and the first deploy plan. §12's eleven mandatory improvements verified individually. Then run `PROJECT_STANDARDS_AUDIT_PROMPT.md` against the repo and keep the report.

**Gate:** audit report with zero Critical and zero High findings. Medium and Low become pipeline entries with IDs, not a wiki page.

### Phase 6 — Cadence (recurring)

Quarterly: re-run the audit and diff its section I against the previous run; sweep `EXCEPTIONS.md` for expired entries; review §1's version floors, which decay faster than anything else in the document; triage the audit's section H into §13 or decline it explicitly.

---

## C.2 — Existing repo (retrofit)

Different problem. You cannot sequence by "cheap now", because nothing is cheap now. Sequence by **blast radius and regression risk** instead.

| Phase | Name | Ends when |
|---|---|---|
| R0 | Audit | Report exists with severities assigned |
| R1 | Stop the bleed | Zero Critical findings |
| R2 | Guardrails first | Bad commits blocked; drift linter runs in warn mode |
| R3 | Cross-cutting shape | Error shape, dates, pagination, actor context uniform |
| R4 | Reference data & forms | Screens migrated to `FieldSpec`; linter moved to blocking |
| R5 | Docs & re-audit | Appendix B docs exist; second audit diffs clean on the top 10 |

**R0 — Audit.** Read-only, using the prompt. Nothing is fixed in this phase. The output is a severity-ranked list and a `file:line` for each item.

**R1 — Stop the bleed.** Critical security only: SQL injection surface, unguarded mutating routes, privilege escalation, secrets in the working tree or in history, tenant leaks. Narrow patches, no refactors, no opportunistic cleanup. The temptation to "fix it properly while I'm here" is what turns a two-day security patch into a three-week branch that ships neither.

**R2 — Guardrails before the big changes, deliberately.** Hooks, CI, ESLint/Prettier, `analysis_options.yaml`, the structural linters, the drift linter in **warn** mode, the companion-file sync table — plus the four first AI-native plays: `CLAUDE.md`, one verification command, build-time hooks, and `REVIEW.md` (§14). This lands before R3 and R4 on purpose: a large refactor without enforcers reintroduces exactly what R1 removed, and nobody notices until the next audit.

**R3 — Cross-cutting shape.** The single error shape, date projection at the boundary, the pagination envelope, actor context. Each of these touches nearly every route, which is why they need R2's linters underneath them and why they come as one phase rather than four — three passes over every route is worse than one.

**R4 — Reference data & forms.** Stand up §3.19's lookup controller, then migrate screens to `FieldSpec` one at a time, highest-traffic first. Hardcoded option lists become tables with maintenance screens as their screen is migrated, not in a big-bang data-modelling exercise. When the last screen is migrated, flip the drift linter from warn to blocking — that flip is the phase gate, and it is the only thing that stops the old pattern from creeping back in a feature branch.

**R5 — Docs & re-audit.** Backfill the PRD, Blueprint, and pipeline against Appendix B — backfilled from the code, which is honest, rather than from memory, which is not. Then re-run the audit and diff section I against R0. The diff, not the second report, is the deliverable.

---

## What phasing does not license

- **Skipping §9 "until we're further along".** The definition of done applies to feature #1. A team that defers it is not moving faster, it is accruing a phase-5 bill it has not measured.
- **Deferring the audit trail.** Every other rule here can be retrofitted at a cost. Un-audited historical writes cannot.
- **Treating a phase gate as a formality.** A gate signed off by the person who did the work is not a gate.
- **P1 work during phase 4.** If a P1 entry is genuinely blocking a P0 entry, the tier is wrong — fix the tier in the pipeline, with the argument written in `Why this tier`, rather than quietly building it out of order.
</script>
<script type="text/plain" id="src-sdlc"># AI-Native SDLC — process design for the Dynamiq standard

> **Version**: 1.0 | **Date**: 2026-09-20 | **Status**: Living document
> **Companion to**: `NEW_PROJECT_STANDARDS_CHECKLIST.md`, `PROJECT_STANDARDS_AUDIT_PROMPT.md`, `PRODUCT_LIFECYCLE.md`
> **Against**: Anthropic's *The AI-Native SDLC playbook* (2026-08-21), six stages — Plan, Design, Build, Test, Deploy, Maintain.
> **Purpose**: the reasoning behind checklist §14. Background, not a rule source — where this document and the checklist differ, the checklist governs.

---

## 1. The reconciliation

The playbook and this standard look like they compete. They do not. They operate at two different granularities, and almost every apparent conflict dissolves once that is stated:

| | Granularity | Lifetime | Examples |
|---|---|---|---|
| **Standing artifacts** (this standard) | The system | Years | PRD, Master Blueprint, `FEATURE_PIPELINE.md`, `schema.sql`, E2E manuals |
| **Change artifacts** (the playbook) | One change | Days, then archived | `intent.md`, `spec.md`, `plan.md`, the diff, the PR, the incident record |

Standing artifacts are **constraints**. Change artifacts are **transactions against those constraints**. The playbook's criticism of PRDs — that they exist to force alignment across months of slow building — lands on the PRD as a *per-change alignment ritual*. It does not land on the PRD as a *standing statement of what the product is and is not*, which is exactly what the not-list in PRD §2 and the compliance jurisdiction in PRD §7 are for.

So the design is: **keep the standing artifacts, stop using them as the per-change workflow, and route every change through the playbook's chain — with the pipeline entry as the join key between the two layers.**

The second reconciliation is about enforcement. The playbook distinguishes an **advisory control** (a skill, which makes the agent likely to comply) from a **deterministic control** (a hook, which makes non-compliance impossible). This standard already carries an *enforcer* column on nearly every rule — script, hook, CI job, or an honest "code-review item". That column is the migration plan. It maps one-to-one onto skill / hook / CI / `REVIEW.md`, and §4 below does the mapping.

---

## 2. The unified artifact chain

```mermaid
flowchart LR
  subgraph standing["Standing — the system"]
    PRD[PRD]
    BP[Master Blueprint]
    PIPE[FEATURE_PIPELINE.md]
  end
  subgraph change["Per change"]
    I[intent.md] --> S[spec.md] --> P[plan.md] --> D[diff + tests] --> PR[PR + findings]
  end
  PRD -.constrains.-> S
  BP -.constrains.-> S
  BP -.constrains.-> P
  PIPE -->|entry ID names the change| I
  PR -->|merged| PIPE
  PR -.new named rule.-> BP
  PR -.scope change.-> PRD
  MON[control band / scan / @Claude] --> I
  PR --> MON
```

**The join key.** Every change carries a pipeline ID. `intent.md` for pipeline entry `P0-05` lives at `intent/P0-05-ring-up-a-sale.md`, its spec at `spec/P0-05.md`, its plan at `plan/P0-05.md`. The pipeline entry's attribute table gains four rows — `Intent`, `Spec`, `Plan`, `PR` — and becomes the index of the chain rather than a parallel backlog. This is the single most important structural change in this document: without it you get two backlogs, and the pipeline rots into a status board nobody trusts.

**Source of truth.** The repo. Markdown artifacts are authoritative; any tracker holds a link and the commit SHA. Declared here once, per the playbook's guidance to name one system of record per artifact.

---

## 3. The process, stage by stage

### Stage 1 — Plan

**Trigger:** a person's idea, a client request, a control-band breach, a scheduled scan finding, or an `@Claude` mention in the incident channel.

**What happens.** The originator — a PO, a support lead, a branch supervisor, anyone — brainstorms with Claude and produces `intent.md` in their own words, using the org template loaded as a skill. Not a ticket, not a user story, and specifically not a PRD amendment.

**What this standard adds to a plain `intent.md`.** Two required fields, because they determine everything downstream and cost nothing to ask at the start:

- **Profile deltas** — does this change touch money, tenancy, dates, or reference data? These flags route the spec pass to the right skills.
- **PRD trace** — the `PRD §6.x` this serves, or `NEW` if it needs a new PRD subsection. `NEW` is the signal that a human PO decision is required before Stage 2 rather than after it.

**Committed:** `intent/<pipeline-id>-<slug>.md`. The PO approves by merging. A `NEW` intent that the PO accepts appends a subsection to PRD §6 — appended, never renumbered, per the stable-anchor rule.

**Gate:** human. The PO.

### Stage 2 — Design

**What happens.** Claude reads the accepted `intent.md` and produces `spec.md`, constrained by the skills that carry this standard (§4) and by the project's Blueprint Parts 1–4. Concerns are flagged, not silently resolved.

**The spec pass must flag, not decide, these five:** a new table or column (schema is a human gate), a change to a Part 6 named rule, anything touching the compliance context in Blueprint Part 1, a new external integration, and any deviation from checklist §1's stack. These are the five categories where a wrong autonomous decision is expensive and slow to detect.

**Committed:** `spec/<pipeline-id>.md`. Where the spec adds or changes a table, the schema change is reviewed by a human before Stage 3 — this is Appendix C phase 0's gate, applied per change instead of once per project.

**Gate:** human. PO for scope, tech lead for anything flagged.

### Stage 3 — Build

**What happens.** Claude Code in plan mode reads `spec.md` plus `CLAUDE.md`, interviews the engineer, and produces `plan.md` naming the files that change, the order, and the tests that prove it. Then implementation, with skills applying this standard as the code is written and hooks blocking what must never happen.

**What this standard adds to `plan.md`:** the plan must name which **§9 definition-of-done items** the change triggers, and which **Blueprint Part 6 named rules** apply. Both are mechanical from the spec's profile deltas, and both give the Stage 5 review something concrete to check the diff against.

**Committed:** `plan/<pipeline-id>.md`, then the diff and its tests. When implementation departs from the plan, `plan.md` updates in the same commit — a hook enforces that.

**Gate:** engineer accepts the plan. Higher-risk categories (from Stage 2's flag list) go to the tech lead.

### Stage 4 — Test

**The feedback loop.** One command, `make verify`, must run the drift linter, the structural linters, the syntax tests, and the e2e suite, exiting non-zero on failure. Claude runs it and iterates before an engineer sees anything. `CLAUDE.md` states the command and what healthy output looks like.

**This standard's §9 splits three ways here**, and the split is the work:

| §9 item | Becomes |
|---|---|
| 1, 2 migration discipline | Hook (blocks edits to committed migrations) + CI check |
| 3 parameterized SQL, allow-lists | Skill + structural lint in `make verify` |
| 5 tenant and branch predicates | Structural lint + `REVIEW.md` pass |
| 6, 7 money and dates | Skill + structural lint (`new Date()` ban in engines) |
| 8 idempotency | Unique index (the database is the enforcer) + `REVIEW.md` |
| 9 `FieldSpec`, drift linter | Hook (runs after Flutter file edits) |
| 4, 10 permissions, menus, reference completeness | `REVIEW.md` compliance pass |
| 11 inactive-lookup case | Test case, in `make verify` |
| 12, 13 manuals and suites | `make verify` |
| 14, 15 sync table, pipeline update | Hook at commit + `REVIEW.md` |

A fifteen-item human checklist does not survive parallel sessions. Every item above that stays human-only will be skipped by the third concurrent session. That is not a discipline problem; it is arithmetic.

**Evals.** 20–50 real tasks drawn from past features, run non-interactively in CI on any change to `CLAUDE.md`, `.claude/skills/**`, or `.claude/hooks/**`. Each production incident becomes a permanent eval. This is what stops a skill edit silently degrading the standard for every repo at once — the failure mode a centrally distributed plugin creates and nothing else catches.

### Stage 5 — Deploy

**`REVIEW.md` at each repo root**, with four passes rather than the playbook's three, because this standard has a fourth thing to check:

1. **Bugs** — logic, edge cases, regressions.
2. **Security** — checklist §3, §6: injection, unguarded routes, privilege escalation, secrets, tenancy.
3. **Standard compliance** — the checklist rules whose enforcer column reads "code-review item". These and only these; anything a linter already catches is excluded, per the playbook's rule about not reporting what CI enforces.
4. **Artifact compliance** — does the diff match `plan.md`, does the pipeline entry exist and move, is the sync table walked, was `schema.sql` updated with teardown.

**Approval gates as hooks.** Production deploy requires a named release authorization. Migrations already committed cannot be edited. `schema.sql` teardown must accompany a `CREATE TABLE`. Non-negotiable hooks live in managed settings the platform owner controls, not in a repo file an engineer can edit.

**The agent acts up to the production gate and not past it.** Branch protection means everything the agent produces arrives as a PR; the agent that wrote the code has no route to approve it.

### Stage 6 — Maintain

**Three inbound routes, one outbound format.** A control-band breach, a scheduled security scan finding, or an `@Claude` mention in the incident channel. All three produce `intent.md`, and the loop closes.

**Control bands** in version-controlled `bands.yaml`. Detection is deterministic — no model in the detection path. Suggested first metrics for a system built to this standard, because they map to its actual failure classes: post-deploy 5xx rate, audit-table daily row growth (the retention policy's early-warning signal), drift-linter failure rate, and idempotency-key collision rate (a rising collision rate means lanes are retrying, which means something upstream is broken).

**The incident loop this standard already mandates, now automated:** incident → postmortem → **a named rule in Blueprint Part 6** → if the rule has an enforcer, a skill or hook → an eval that keeps it enforced. Part 6's existing incident-first convention is precisely the input format this stage needs.

**The audit becomes scheduled.** `PROJECT_STANDARDS_AUDIT_PROMPT.md` stops being a prompt someone pastes quarterly and becomes a non-interactive job. Its section H output — rules this repo needed that the checklist lacks — is triaged into checklist §13.

---

## 4. Decomposing the checklist into skills, hooks, and review passes

The checklist cannot be a skill. It is 827 lines, and the playbook is explicit that `CLAUDE.md` stays under a page because the agent reads all of it every session. Nor can "read the 120-page Blueprint before schema work" survive as a `CLAUDE.md` instruction. **Skills solve both**: they load on trigger, so the schema rules arrive when someone touches schema and cost nothing otherwise.

Distribute as one private plugin, `dynamiq-standards`, so every repo gets the same version and a policy change ships once.

| Skill | Triggers on | Carries | Backing hook / lint |
|---|---|---|---|
| `sql-data-access` | writing or reviewing any query | §3.7, §3.9, §3.11, §3.19 | structural lint: interpolation into query text; allow-list required for sort and lookup names |
| `money-and-dates` | any monetary or date value | §3.9 rounding, §3.10 boundary projection, Blueprint invariants 1–2 | lint: `new Date()` banned inside `services/engines/`; float-on-money lint |
| `tenancy-and-authz` | any query, route, or guard | §3.4, §3.5 | tenant-scope lint (§12) |
| `audit-and-actor` | any mutating route | §3.6, §3.18, A.1, A.3 | CI check: mutating route without audit-on-finish |
| `schema-derived-forms` | any Flutter form, list, or picker | §4.10, §3.19, A.13 | **drift linter** — the enforcer that makes the skill real |
| `frontend-surface` | any widget, theme, or message | §4.6, §4.7, §4.5 | lint: colour literals, `showSnackBar` outside the surface |
| `migration-and-process` | any migration or schema file | §8.1, §8.2 | hook: block edits to committed migrations; require teardown |
| `doc-set-authoring` | writing or editing PRD, Blueprint, pipeline | Appendix B.1–B.3 | CI lint on pipeline: status legend, ID uniqueness, dangling refs |
| `feature-dod` | closing out a change | §9, split per §3 above | `make verify` + `REVIEW.md` |
| `intent-authoring` | writing `intent.md` | the template, profile deltas, PRD trace | PO review |

**Rules whose enforcer column reads "code-review item"** do not become skills. They become `REVIEW.md` pass 3. Trying to make an advisory skill carry a rule no tool can check produces a skill that fires constantly and is trusted by nobody.

**`CLAUDE.md`, under a page, per repo:** build/test/lint commands with healthy output; the five or six traps this specific system's agents keep hitting (from Blueprint Part 1's known-traps block, not all of them); pointers to the Blueprint and the skills; and the verification block. Nothing else. When Claude makes the same mistake twice, the correction goes here — and when a mistake recurs across repos, it graduates from `CLAUDE.md` to a skill.

---

## 5. Repo layout

```
repo/
  CLAUDE.md                     # under a page
  REVIEW.md                     # the four passes
  intent/    P0-05-ring-up-a-sale.md
  spec/      P0-05.md
  plan/      P0-05.md
  docs/      RETAILPOS_PRD.md
             RETAILPOS_MASTER_BLUEPRINT.md

  .claude/
    settings.json               # team hooks
    hooks/                      # drift-check, migration-guard, plan-sync
    agents/verifier.md          # runs make verify in a fresh context
    skills/                     # project-specific only; company skills arrive by plugin
  evals/                        # 20-50 tasks + check.sh
  bands.yaml
  db/  backend/  lib/  ...
```

---

## 6. Six tensions, and how each resolves

**1. The playbook is sceptical of PRDs; this standard mandates one.**
Resolve by role, not by deletion. The PRD stops being the per-change alignment ritual and becomes the standing constraint document that intents are written against. Per-change alignment happens in `intent.md`. PRD §6 is appended by accepted intents; it is not rewritten in workshops.

**2. `CLAUDE.md` under a page vs. required reading of a 120-page Blueprint.**
Skills. `CLAUDE.md` points; skills load Blueprint Part 3 when someone touches schema and Part 6 rule 6.1 when someone touches a business date. The §8.4 required-reading rule is satisfied better than before, because the reading now arrives at the moment it is relevant instead of at session start where it competes for context.

**3. Two backlogs.**
The pipeline is the index; `intent/` holds the content; the pipeline ID is the filename. Four new rows on the entry attribute table (`Intent`, `Spec`, `Plan`, `PR`). Without this the two layers drift within a month.

**4. A fifteen-item human definition of done vs. parallel sessions.**
Split it (§3, Stage 4). What stays human must be genuinely unmechanizable, and there should be three or four such items, not fifteen.

**5. Centrally distributed skills mean one edit changes every repo.**
This is the risk the plugin model creates. Evals gated on changes to `CLAUDE.md`, skills, and hooks are the only control that catches it. Do not ship the plugin before the eval suite exists.

**6. Governance cadence.**
Checklist §13 says quarterly review. The playbook's loop runs continuously. Reconcile: skill and hook changes ship continuously behind the eval gate with policy-owner sign-off; the §13 quarterly review becomes a review of *what the loop already changed*, plus the version-floor sweep and the `EXCEPTIONS.md` expiry sweep. The quarterly meeting stops being where change happens and becomes where change is audited.

---

## 7. Adoption order

The playbook's plays are modular with named prerequisites. Given where this standard already stands — strong written rules, weak automation — this is the order that yields the most per step.

| Step | Play | Why here | Prereq |
|---|---|---|---|
| 1 | `CLAUDE.md` per repo | No prerequisites, immediate return, and it is already mandated by §8.4 | — |
| 2 | Feedback loop (`make verify`) | Every later play assumes the agent can check its own work. The linters mostly exist already; this wires them into one command | — |
| 3 | Hooks as build guardrails | Converts the highest-value existing rules from advisory to deterministic: migration edits, `new Date()` in engines, drift linter, direct on-hand writes | 2 |
| 4 | `REVIEW.md` + PR review | Absorbs the "code-review item" rules that no tool can check, at last consistently | 1, 3 |
| 5 | Skills plugin | The big one. Do it after 1–4 so the deterministic layer exists behind the advisory one | 4 |
| 6 | Evals in CI | Must land with or before the plugin's first policy change | 5 |
| 7 | `intent.md` + `spec.md` flow | Needs the template as a skill and a PO with Claude access | 5 |
| 8 | Hooks as approval gates + CI/CD | Production gate, per-environment tiers, rehearsed rollback | 3, 4 |
| 9 | Closing the loop | Bands, scheduled audit, scheduled scan, `@Claude` on call | 6, 8 |

**Mapping to Appendix C.** For a greenfield project, steps 1–4 land inside C phase 1 (rails and guardrails), steps 5–6 inside C phase 3, steps 7–8 before C phase 4's first feature, and step 9 in C phase 6. For a retrofit, steps 1–3 are C.2's R2 — which is exactly where R2 already sits, and for the same reason: guardrails before the big changes.

---

## 8. Concrete artifacts

### 8.1 `CLAUDE.md` (RetailPOS, complete)

```markdown
# RetailPOS

## Commands
- Verify: make verify  (drift linter + structural lints + syntax + e2e; must end "ALL GREEN")
- Migrate check: npm run migrate:check
- Run all three before reporting any task complete, and paste the output.
- If a test fails, fix the code, not the test.

## Conventions
- Node + Express, MSSQL, raw parameterized SQL. No ORM. Flutter Web + Provider.
- Money is decimal.js and DECIMAL(18,4). Never float, at any layer.
- Business dates are DATE and come from the open shift, never from a clock.
- Every scoped query carries BOTH TenantId and BranchId.

## Required reading (skills load these on trigger)
- Schema or migration work: Blueprint Part 3 and Part 1 invariants.
- Any form, list, or picker: checklist §4.10 and Appendix A.13.
- Any engine change: Blueprint Part 4 and the Part 6 rule the engine owns.

## Things Claude gets wrong here
- Writing on_hand directly. Insert a StockMovement (Blueprint 6.3).
- new Date() inside services/engines/. Business date comes from the shift (6.1).
- Allocating a receipt number before the transaction. Gaps are a BIR finding (6.2).
- Adding a dropdown with hardcoded options. It is a table (6.6).
```

### 8.2 A skill (excerpt)

```markdown
---
name: schema-derived-forms
description: Apply the schema-derived form standard. Use whenever creating or
  modifying a Flutter form, list, filter, or picker; when adding a selection
  input; or when adding a reference/lookup table.
---
# Schema-derived forms

The schema is the contract; a form is a projection of it.

1. Declare a FieldSpec per field. Never instantiate TextFormField in a view.
2. Widget from the column type: DATE -> date-only picker emitting yyyy-MM-dd;
   BIT -> switch, never a Yes/No dropdown; DECIMAL(p,s) -> numeric constrained
   to s; NVARCHAR(n) -> maxLength n; FK -> async paginated picker.
3. Cardinality from the schema: FK column = single, junction table = multi.
4. Validators derived: required mirrors NOT NULL, maxLength mirrors the column.
5. A picker retains a currently-held inactive value and never clears it on save.
6. No hardcoded option lists. If a client could ever ask to add a value, it is a
   table with a maintenance screen, seeds, permissions, and a menu entry.

Run `npm run test:schema-forms` and include its output in your summary.
```

### 8.3 A build-time hook

```bash
#!/bin/bash
# .claude/hooks/migration-guard.sh — a committed migration is immutable
path=$(jq -r '.tool_input.file_path' < /dev/stdin)
if [[ "$path" == *"/db/migrations/"* ]] && git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
  echo "This migration is already committed. Write a new numbered migration instead (checklist §8.2)." >&2
  exit 2
fi
exit 0
```

### 8.5 `intent.md`

```markdown
# Intent: cashiers cannot see why a sale failed to sync
Author: R. Dela Cruz (branch operations). Status: draft. Pipeline: NEW

## Problem
When a queued offline sale fails to sync, the lane shows a generic error.
Supervisors phone support to find out which sale is stuck. Roughly four calls
a week per branch since the pilot.

## Proposed outcome
The lane shows a per-sale sync state with a plain-language reason, and a
supervisor can retry a single stuck sale.

## Affected users and systems
Cashiers, supervisors, lane sync worker, sale engine.

## Profile deltas
Money: no. Tenancy: no. Dates: no. Reference data: yes (a sync-failure reason list).

## PRD trace
PRD §6.1 (offline selling) — extends its acceptance criteria; no new §6 subsection.

## Open questions
Should a supervisor be able to discard a stuck sale, or only retry?
Discarding a sale has BIR implications and probably needs Grace's input.
```

## 9. Measurement

Playbook indicators, narrowed to what this standard cares about.

| Stage | Leading | Lagging |
|---|---|---|
| Plan | Hours from conversation to committed `intent.md` | Share of intents the PO accepts |
| Design | `intent.md` → `spec.md` elapsed | `spec.md` commits dated after the first `plan.md` (requirements rework) |
| Build | Share of changes merging on the first implementation pass | How often the merged diff still matches `plan.md` |
| Test | First-pass `make verify` success for agent-written changes; eval pass rate | Regressions caught in CI vs. found in production |
| Deploy | Time to first review; review comments resolved without a human touching the branch | Defects caught before merge vs. escaping |
| Maintain | Time from band breach to `intent.md` in the queue | Repeat incidents of the same class |

**One measure specific to this standard**: audit findings per quarter, split into "rule existed and was violated" versus "no rule existed" (section H). The first number should fall as hooks and skills land. The second is the honest measure of whether a standard distilled from one system is learning from the others.
