# lint: the fast, database-free half of `npm run verify`, plus the two guards that until now ran only in the
# local pre-commit hook (secret guard, changelog duplicate guard) and the migration-history check (L133, plan S7).
# L136: with e2e.yml, one of the two REQUIRED checks on every pull request to main ("lint" is this job's name);
# every change reaches main through a branch and a pull request, and the local pre-push hook is the first gate.
#
# Runs on every push and every pull request. A push run and a pull-request run for the same branch are two
# separate runs (the event is in the concurrency group below); a push to main is never cancelled by anything.
#
# COST (L135: the repository is public): usage is free for public repositories that use standard GitHub-hosted
# runners ("GitHub Actions usage is free for self-hosted runners and for public repositories that use standard
# GitHub-hosted runners", docs.github.com, Actions billing, fetched 2026-10-08), so there is no monthly budget
# of minutes to protect. Time, not money: about 6 minutes a run with the Flutter and npm caches warm, about 10
# on a cold cache (estimate, not measured: this file has not run yet). Actions cache storage is 10 GB per
# repository (same page).
#
# Fork pull requests: this workflow has no secrets and `contents: read`. A cache saved by a pull_request run is
# scoped to the pull request's merge ref and cannot be restored by the base branch or other pull requests
# (docs.github.com, dependency caching, "Restrictions for accessing a cache" and "Cache access for low-trust
# workflow triggers", fetched 2026-10-08), so a fork cannot poison main's caches through this file. Only push
# runs on main write the caches that every pull request restores.
#
# Needs no database and no emulator: verify's api-tests and db-tools-tests connect to PostgreSQL, so they run
# in e2e.yml with the schema, the seed and the Functions emulator.
name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

# Push runs are one per commit (so no pushed commit is ever left without its lint); a newer push to the same
# pull request cancels the older pull-request run.
concurrency:
  group: lint-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the migration-history check below needs the base branch

      - name: Set up Node.js (the version in .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            db/tools/package-lock.json

      - name: Install the API's packages (ESLint and Prettier come from here)
        run: npm ci --prefix functions

      - name: Install the database tools' packages
        run: npm ci --prefix db/tools

      - name: Cache Flutter
        id: flutter-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/flutter
          key: flutter-3.47.5-${{ runner.os }}

      - name: Install Flutter 3.47.5 (the Blueprint pin)
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$HOME/flutter"

      - name: Put Flutter on the PATH
        run: echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Cache the Dart and Flutter packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-

      - name: Secret guard and changelog duplicate guard (the checked-out tree)
        run: npm run ci:guards

      # On a pull request: against the base branch. On a push: against the tip the branch had before the push
      # (a new branch or a force push is compared with origin/main, and a warning says so when there is
      # nothing to compare with). tools/ci-migrations.js decides and prints which, and why.
      - name: Committed migrations are never edited (push and pull request)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: node tools/ci-migrations.js

      - name: verify, the checks that need no database
        run: >-
          node tools/verify.js --only
          node-version,node-check,structural-linters,linter-tests,tools-tests,eslint,prettier,flutter-analyze,flutter-test
