# e2e: the database half of `npm run verify`, against a real PostgreSQL 18 service, on every pull request to main,
# every night and on demand (L133, plan S7, L136): the schema twice (it must be re-runnable), the API's tests and
# the database tools' tests against that schema, the test seed with the Firebase Auth emulator, and the Functions
# emulator answering /api/health. L136: with lint.yml, one of the two REQUIRED checks on every pull request to main
# ("e2e" is this job's name).
#
# NO repository secrets, and none needed: a pull request from a fork gets none anyway. The .env is written during
# the job from throwaway values: the database password is derived from the run id (the service container is only
# reachable on the runner), and every SEED_PW_* is random per run and masked in the log. Nothing is echoed.
#
# The service image is pinned to postgres:18.6, the Blueprint's PostgreSQL pin (L147), so CI cannot drift to a
# newer patch release unannounced. A move to another patch release is a one-line change to the image, the same
# change to the log step's `ancestor=` filter (Docker's filter is <image-name>[:<tag>], and a name without a
# tag means latest) and its message, and the matching edits to the rule, the pinned step and the snapshot
# under tools/test.
#
# Java: not installed on purpose. firebase-tools 15.32.1 checks for Java 21 or newer only when an emulator
# that runs on Java is started (controller.js: targets.some(requiresJava); commandUtils.js:
# MIN_SUPPORTED_JAVA_MAJOR_VERSION = 21), and those are Firestore, Realtime Database and Storage
# (downloadableEmulators.js: binary "java"). Auth and Functions, the only emulators Gabay starts, run on Node.
# If Gabay ever starts one of the Java emulators, add actions/setup-java with Temurin 21 before the seed.
#
# COST (L135: the repository is public): usage is free for public repositories that use standard GitHub-hosted
# runners ("GitHub Actions usage is free for self-hosted runners and for public repositories that use standard
# GitHub-hosted runners", docs.github.com, Actions billing, fetched 2026-10-08), so there is no monthly budget of
# minutes to protect. Time: about 6 minutes a run (checkout and npm ci of three packages including firebase-tools
# about 2, schema and seed about 1, emulator health about 1, tests about 1; an estimate, not measured: this file
# has not run yet). The log artifact lives 7 days. A scheduled workflow runs only on the default branch.
#
# TIMEOUTS: every verify check is capped at 5 minutes here (GABAY_VERIFY_CHECK_TIMEOUT_MS), so a hung check
# fails by itself with its output. The job limit is 50 minutes: six checks at the cap (30), about 10 minutes of
# setup, the two 30-second shutdown waits of the seed and the emulator check (1), and 5 minutes of margin
# (tools/test/workflow-rules.js computes it). Before this the checks' own limits (10 minutes each) were longer
# than the job's, so a hang ended as a cancelled run with no log. The log steps below also run when cancelled.
#
# 02:00 in Manila (UTC+8) is 18:00 UTC, so the cron below is 0 18 * * *.
name: e2e

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; nightly and manual runs queue and never cancel.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DB_PASSWORD: gabay-ci-${{ github.run_id }}-${{ github.run_attempt }}
      GABAY_VERIFY_CHECK_TIMEOUT_MS: '300000'
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: gabay-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: gabay_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gabay_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (the version in .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            db/tools/package-lock.json
            db/seeds/package-lock.json

      - name: Install the API's packages
        run: npm ci --prefix functions

      - name: Install the database tools' packages
        run: npm ci --prefix db/tools

      - name: Install the seed's packages (firebase-tools lives here)
        run: npm ci --prefix db/seeds

      - name: Write .env from throwaway values (no repository secrets, nothing echoed)
        shell: bash
        run: |
          set -eu
          umask 077
          {
            echo "PGHOST=localhost"
            echo "PGPORT=5432"
            echo "PGDATABASE=gabay_dev"
            echo "PGUSER=postgres"
            echo "PGPASSWORD=$DB_PASSWORD"
          } > .env
          for account in SUPERADMIN MALLADMIN EDITOR VIEWER MALLADMIN_DEMO SHOPPER; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "SEED_PW_$account=$value" >> .env
          done

      # verify runs its checks in its own fixed order whatever the order named here: the schema twice first
      # (a fresh database has no schema), then the tests that read it, then the seed and the emulator.
      - name: verify, the database half
        shell: bash
        run: |
          node tools/verify.js --only schema-run-1,schema-run-2,api-tests,db-tools-tests,seed,functions-health 2>&1 | tee verify.log

      - name: Collect the PostgreSQL service log (on failure or cancel)
        if: failure() || cancelled()
        shell: bash
        run: |
          id="$(docker ps -aq --filter ancestor=postgres:18.6 | head -n 1)"
          if [ -n "$id" ]; then
            docker logs "$id" > postgres.log 2>&1
          else
            echo "no postgres:18.6 container found: there is no service log to collect"
          fi

      - name: Upload the server and emulator logs (on failure or cancel)
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ github.run_id }}
          path: |
            verify.log
            postgres.log
            firebase-debug.log
            ui-debug.log
            db/seeds/firebase-debug.log
          if-no-files-found: ignore
          retention-days: 7
